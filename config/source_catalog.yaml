# Ämnen (typ topic: nyhetssökning + Hacker News). Bra där en sajt saknar flöde, t.ex. svensk startuppress.
topics:
  - {name: Svenska startups, query: "startup Stockholm finansiering", lang: sv}
  - {name: Studentjobb tech Stockholm, query: "sommarjobb studenter tech Stockholm", lang: sv}
  - {name: Hackathons Sverige, query: "hackathon Stockholm", lang: sv}
  - {name: Språkinlärning tech, query: "language learning app", lang: en}

