# Källkatalog: verifierade, publika källor som Director kan välja bland för att bredda nätet.
# Inga personliga uppgifter. Kontrollerade 2026-10-11 (HTTP 200 och innehåll). Director lägger till
# det som passar ägarens mål i instansen; allt filtreras sedan av förfilter, triage och dispatcher.

