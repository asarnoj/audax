<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gråskiss · Audax</title>
<style>
  /* The office fills the window; the test settings sit in a small panel on top for now. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f8f8f7; font: 13px/1.4 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #panel { position: fixed; left: 12px; top: 12px; max-width: min(520px, calc(100vw - 24px)); padding: 8px 12px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.82); color: #333; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
  #panel.hidden .body { display: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 6px 0; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  #time { width: min(300px, 60vw); }
  #info { color: #666; font-variant-numeric: tabular-nums; margin: 4px 0 0; }
  a { color: #47a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <div><a href="/">← Kontoret</a> · gråskiss · <button id="toggle">Dölj</button></div>
  <div class="body">
    <div class="controls">
      <label>Tid <input id="time" type="range" min="0" max="1439" step="1"></label>
      <span id="clock"></span>
      <button id="now">Nu</button>
      <button id="play">Spela dygnet</button>
    </div>
    <div class="controls">
      <label>Datum <input id="date" type="date"></label>
      <label>Moln <input id="clouds" type="range" min="0" max="100" value="0" style="width: 110px"></label>
      <label>Lampor <select id="lamps"><option value="auto">när det är mörkt</option><option value="on">på</option><option value="off">av</option></select></label>
      <label>Ljus <select id="mode"><option value="band">i band</option><option value="soft">mjukt</option></select></label>
    </div>
    <p id="info"></p>
  </div>
</div>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// Units are centimetres. The room is seen from straight above: x right, y down, z up.
// Every object is a prism: a convex footprint at z0 and (for limbs) another at z1. Its shadow on a
// surface at height zr is the convex hull of its corners projected along the light onto that plane.
// ---------------------------------------------------------------------------------------------
const DESK_BANDS = [[0.45, 1.0], [0.16, 0.62], [0.06, 0.34], [0.03, 0.16]]; // [share of the light under the lamp, brightness]
const LAT = 59.33, LON = 18.07, TZ = "Europe/Stockholm";
const ROOM = { w: 792, h: 544, wall: 20, height: 270 };  // the floor plan (Figma, 14 Oct): a 50 cm grid
const GROUND = 4000;  // the ground runs on well past any screen's edge, so light and shadows never stop short

// --- geometry ---------------------------------------------------------------------------------
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
const circle = (cx, cy, r, n = 16) => Array.from({ length: n }, (_, i) => [cx + r * Math.cos(2 * Math.PI * i / n), cy + r * Math.sin(2 * Math.PI * i / n)]);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);

function hull(points) { // monotone chain, counter-clockwise
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

function area(poly) { let a = 0; for (let i = 0; i < poly.length; i++) { const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length]; a += x1 * y2 - x2 * y1; } return a / 2; }

function clip(subject, clipper) { // Sutherland–Hodgman: convex ∩ convex
  if (area(clipper) < 0) clipper = clipper.slice().reverse();
  let out = subject;
  for (let i = 0; i < clipper.length && out.length; i++) {
    const a = clipper[i], b = clipper[(i + 1) % clipper.length];
    const inside = p => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]) >= 0;
    const meet = (p, q) => { const d1 = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]), d2 = (b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]); const t = d1 / (d1 - d2); return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]; };
    const input = out; out = [];
    for (let j = 0; j < input.length; j++) {
      const p = input[j], q = input[(j + 1) % input.length];
      if (inside(q)) { if (!inside(p)) out.push(meet(p, q)); out.push(q); } else if (inside(p)) out.push(meet(p, q));
    }
  }
  return out;
}

function bbox(poly) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const [x, y] of poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return [x0, y0, x1, y1]; }
const overlaps = (a, b) => a[0] <= b[2] && b[0] <= a[2] && a[1] <= b[3] && b[1] <= a[3];

// --- the sun (NOAA's low-precision formulas, good to a fraction of a degree) ----------------------
function sun(date) {
  const rad = Math.PI / 180, n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360, g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad, eps = (23.439 - 0.0000004 * n) * rad;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda)), dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const gmst = (18.697374558 + 24.06570982441908 * n) % 24, H = (gmst * 15 + LON) * rad - ra, phi = LAT * rad;
  const el = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(-Math.sin(H), Math.tan(dec) * Math.cos(phi) - Math.sin(phi) * Math.cos(H));
  return { el: el / rad, az: (az / rad + 360) % 360 };
}

const LOCAL = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
function localParts(date) { return Object.fromEntries(LOCAL.formatToParts(date).map(p => [p.type, p.value])); }

function stockholm(dateStr, minutes) { // local wall time in Stockholm (minutes may have a fraction) → the instant
  const [Y, M, D] = dateStr.split("-").map(Number);
  const guess = Date.UTC(Y, M - 1, D) + minutes * 60000;
  const p = localParts(new Date(guess));
  const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return new Date(guess - (shown - guess));
}

function kelvin(k) { // Tanner Helland's approximation, 0..1
  const t = k / 100;
  const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  const b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  return [r, g, b].map(v => clamp(v, 0, 255) / 255);
}
const mix = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
const css = (c, k = 1) => `rgb(${c.map(v => Math.round(clamp(v * k, 0, 1) * 255)).join(",")})`;

// --- the room (the floor plan, measured from the sketch) ------------------------------------------------
const C = { floor: "#f5edc6", wall: "#3b3a38", desk: "#b3aca0", chair: "#8a857d", tray: "#e9e5dd", lamp: "#77736c", shade: "#e4ded2",
  screen: "#4b4a48", keys: "#7c7973", board: "#a59a86", note: "#d9c46a", calendar: "#c9c3b8", line: "#6f6a62", cabinet: "#9c968c",
  drawer: "#aaa499", telex: "#8f8a82", paper: "#efece6", bin: "#8d8a84",
  body: "#6e6a64", head: "#56524d", limb: "#625e58", shoe: "#46433f" };

const objects = [];   // static: { id, poly, z0, z1, color, top?, face?, group, occludes, receives }
const add = (o) => { objects.push(Object.assign({ occludes: true, receives: true, group: o.id }, o)); };
const ellipse = (cx, cy, rx, ry, n = 16) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

// A tilted plate (the board, the calendar): low along one edge, high along the opposite one. As a prism from the
// low edge to the high edge its shadow is the plate's; it takes light on its whole face, at its middle height.
function tilted(x, y, w, h, high, zLow, zHigh) { // the plane of a plate rising towards its `high` edge
  const n = { n: [0, (zLow - zHigh) / h, y], s: [0, (zHigh - zLow) / h, y + h], w: [(zLow - zHigh) / w, 0, x], e: [(zHigh - zLow) / w, 0, x + w] }[high];
  const [B, C] = n, A = high === "n" ? zHigh - C * y : high === "s" ? zLow - C * y : high === "w" ? zHigh - B * x : zLow - B * x;
  return { A, B, C };
}
function plate(id, x, y, w, h, high, zLow, zHigh, color, legs = true) {
  const strip = { n: rect(x, y, w, 3), s: rect(x, y + h - 3, w, 3), w: rect(x, y, 3, h), e: rect(x + w - 3, y, 3, h) };
  const opposite = { n: "s", s: "n", w: "e", e: "w" }[high];
  const plane = tilted(x, y, w, h, high, zLow, zHigh), at = (px, py) => plane.A + plane.B * px + plane.C * py;
  if (legs) { // four legs from under the plate's corners, splaying out like an easel's so their feet show
    const cx = x + w / 2, cy = y + h / 2, out = 10;
    for (const [k, [lx, ly]] of [[x + 4, y + 4], [x + w - 4, y + 4], [x + w - 4, y + h - 4], [x + 4, y + h - 4]].entries()) {
      const d = Math.hypot(lx - cx, ly - cy), fx = lx + (lx - cx) / d * out, fy = ly + (ly - cy) / d * out;
      add({ id: `${id}-leg-${k}`, bottom: circle(fx, fy, 2.2, 8), top: circle(lx, ly, 2.2, 8), z0: 0, z1: at(lx, ly) - 0.5, color, group: id });
    }
  }
  add({ id, bottom: strip[opposite], top: strip[high], face: rect(x, y, w, h), z0: zLow, z1: zHigh, zr: (zLow + zHigh) / 2,
    plane, planeMin: zLow, color });
  // Things lying on the plate (post-its, lines) take its plane too.
  return (pid, poly, pcolor) => add({ id: pid, poly, z0: zLow, z1: zHigh + 0.1, zr: (zLow + zHigh) / 2 + 0.6,  // z1: drawn after the plate
    plane: { A: plane.A + 0.6, B: plane.B, C: plane.C }, planeMin: zLow, color: pcolor, occludes: false, group: id });
}
const rgb = (hex) => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
const flat = (id, poly, z, color, group) => add({ id, poly, z0: z - 0.4, z1: z, color, occludes: false, group: group || id });

// The ground the office stands on: the page's own colour, lit like everything else (the page background is
// this, in the light of the moment, so the office melts into the page).
const BG = "#f8f8f7";
add({ id: "ground", poly: rect(-GROUND, -GROUND, ROOM.w + 2 * GROUND, ROOM.h + 2 * GROUND), z0: 0, z1: 0, color: BG, occludes: false });
add({ id: "floor", poly: rect(0, 0, ROOM.w, ROOM.h), z0: 0, z1: 0, color: C.floor, occludes: false });

// The floor's grid: 50 cm squares, red-brown at low opacity, running about 60 cm past the floor's edge.
const GRID = { step: 50, over: 62, width: 3, color: "rgba(181, 115, 90, 0.30)" };
// Centred: as many lines as fit, with the same margin on both sides.
GRID.x0 = (ROOM.w - (Math.floor(ROOM.w / GRID.step) - 1) * GRID.step) / 2;
GRID.y0 = (ROOM.h - (Math.floor(ROOM.h / GRID.step) - 1) * GRID.step) / 2;
function drawGrid(g) {
  g.fillStyle = GRID.color;
  for (let x = GRID.x0; x < ROOM.w; x += GRID.step) g.fillRect(x - GRID.width / 2, -GRID.over, GRID.width, ROOM.h + 2 * GRID.over);
  for (let y = GRID.y0; y < ROOM.h; y += GRID.step) g.fillRect(-GRID.over, y - GRID.width / 2, ROOM.w + 2 * GRID.over, GRID.width);
}

// Desks: shape and colour, one per person (nothing on them yet). Rounded corners are many-sided, still convex.
function roundRect(x, y, w, h, r, seg = 4) { // r: one radius, or [top-left, top-right, bottom-right, bottom-left]
  const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r], pts = [];
  const corner = (cx, cy, rr, a0) => {
    if (!rr) { pts.push([cx, cy]); return; }
    for (let i = 0; i <= seg; i++) { const a = a0 + (Math.PI / 2) * i / seg; pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
  };
  corner(x + w - tr, y + tr, tr, -Math.PI / 2); corner(x + w - br, y + h - br, br, 0); corner(x + bl, y + h - bl, bl, Math.PI / 2); corner(x + tl, y + tl, tl, Math.PI);
  return pts;
}
const DESK = {
  assistant: "#dcb98a",    // light birch, soft corners: warm and near
  director: "#6b4632",     // dark walnut, heavy, an L: the one who thinks about where you're going
  researcher: "#b5835a",   // an oak work table, long and plain: room for maps and papers
  manager: "#8fa19a",      // a sage-green steel desk, tight corners: order and timing
};
// Turn what was added since `from` a few degrees about (cx, cy): chairs, computers and small things stand a little
// askew, as in a real room. Footprints, slanted parts, faces and tilted planes all turn together.
function turn(from, cx, cy, deg) {
  const t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
  const r = (poly) => poly && poly.map(([x, y]) => [cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c]);
  for (const o of objects.slice(from)) {
    for (const k of ["poly", "bottom", "top", "face", "shape"]) if (o[k]) o[k] = r(o[k]);
    if (o.plane) { // z = A + Bx + Cy, seen from the turned frame
      const { A, B, C } = o.plane, B2 = B * c - C * s, C2 = B * s + C * c;
      o.plane = { A: A + B * cx + C * cy - B2 * cx - C2 * cy, B: B2, C: C2 };
    }
  }
}

// Furniture is built from its parts, like the real thing: a thin top on legs, so light passes underneath and the
// shadow is the top's shape, moved away from the sun, with thin lines from the legs. (A solid block from the
// floor up casts a heavy, wrong shadow.)
function table(id, x, y, w, h, r, seg, top, color, group = id) {
  add({ id, poly: roundRect(x, y, w, h, r, seg), z0: top - 3.5, z1: top, color, group });
  const i = 6;
  for (const [k, [lx, ly]] of [[x + i, y + i], [x + w - i, y + i], [x + w - i, y + h - i], [x + i, y + h - i]].entries()) {
    add({ id: `${id}-leg-${k}`, poly: rect(lx - 2, ly - 2, 4, 4), z0: 0, z1: top - 3.5, color, group, receives: false });
  }
}
table("manager-desk", 22, 22, 76, 190, 3, 4, 74, DESK.manager);
// Director's L: two tops that overlap where they meet, with square corners there, so it reads as one top.
table("director-desk", 560, 142, 213, 78, [4, 0, 4, 4], 4, 76, DESK.director);
table("director-desk-side", 698, 50, 75, 100, [4, 4, 0, 0], 4, 76, DESK.director, "director-desk");
table("assistant-desk", 101, 458, 153, 72, 14, 6, 74, DESK.assistant);
table("researcher-desk", 656, 284, 92, 247, 2, 4, 75, DESK.researcher);
const inboxes = {   // where papers are put, for the figure's errands (not drawn yet)
  manager: rect(50, 160, 34, 28), director: rect(570, 173, 28, 35), assistant: rect(117, 465, 28, 34), researcher: rect(674, 299, 34, 28),
};

// Chairs, one for each person, kept simple: a seat, a back that stands on the seat's edge, and what it stands
// on (a post with five legs on wheels, or four plain legs).
const WHEEL = "#4d4a46";
function chair(role, x, y, back, o) {
  const g = role + "-chair", S = o.size / 2, c = o.color;
  // The seat: round or rounded square. The back: a bar on the side away from the desk, as wide as the seat's
  // edge there (on a round seat, a chord), so it stands on the seat all along.
  const round = o.round, bw = round ? S * 1.4 : 2 * S, inset = round ? Math.sqrt(S * S - (bw / 2) ** 2) : S;
  add({ id: role + "-seat", poly: round ? circle(x, y, S, 24) : roundRect(x - S, y - S, 2 * S, 2 * S, o.corner ?? 8), z0: 43, z1: 47, color: c, group: g });
  const t = o.back ?? 5, at = { n: [x - bw / 2, y - inset - t / 2, bw, t], s: [x - bw / 2, y + inset - t / 2, bw, t], w: [x - inset - t / 2, y - bw / 2, t, bw], e: [x + inset - t / 2, y - bw / 2, t, bw] }[back];
  add({ id: role + "-back", poly: roundRect(...at, t / 2), z0: 47, z1: o.backTop, color: o.backColor || c, group: g });
  if (o.legs === 4) { // four plain legs under the corners
    for (const [k, [lx, ly]] of [[x - S + 3, y - S + 3], [x + S - 3, y - S + 3], [x + S - 3, y + S - 3], [x - S + 3, y + S - 3]].entries()) {
      add({ id: `${role}-leg-${k}`, poly: rect(lx - 1.6, ly - 1.6, 3.2, 3.2), z0: 0, z1: 43, color: c, group: g, receives: false });
    }
    return;
  }
  add({ id: role + "-post", poly: circle(x, y, 2.5, 8), z0: 7, z1: 43, color: o.frame || c, group: g, receives: false });
  for (let k = 0; k < 5; k++) { // five legs on wheels, reaching out past the seat
    const a = 2 * Math.PI * k / 5 + 0.63, u = [Math.cos(a), Math.sin(a)], v = [-u[1], u[0]], w = 1.5, L = S + 6;
    const leg = [[x + v[0] * w, y + v[1] * w], [x + u[0] * L + v[0] * w, y + u[1] * L + v[1] * w], [x + u[0] * L - v[0] * w, y + u[1] * L - v[1] * w], [x - v[0] * w, y - v[1] * w]];
    add({ id: `${role}-leg-${k}`, poly: leg, z0: 6, z1: 8, color: o.frame || c, group: g });
    add({ id: `${role}-wheel-${k}`, poly: circle(x + u[0] * L, y + u[1] * L, 3.8, 12), z0: 0, z1: 7.5, color: WHEEL, group: g });
  }
}
// Manager: a grey-green steel office chair, square and tidy. Director: a big dark executive chair with a tall
// back. Assistant: a light, round, friendly chair. Researcher: a plain wooden chair on four legs.
let from = objects.length;
chair("manager", 105, 71, "e", { size: 42, color: "#7f8f89", corner: 6, backTop: 92 });
turn(from, 105, 71, 4); from = objects.length;
chair("director", 650, 122, "n", { size: 50, color: "#3f3430", corner: 12, back: 7, backTop: 115, frame: "#5a524c" });
turn(from, 650, 122, -7); from = objects.length;
chair("assistant", 199, 440, "n", { size: 42, round: true, color: "#e6e1d8", backTop: 88, frame: "#a9a49b" });
turn(from, 199, 440, 9); from = objects.length;
chair("researcher", 594, 450, "w", { size: 40, color: "#a77a52", corner: 4, back: 4, backTop: 90, legs: 4 });
turn(from, 594, 450, -4);

// Computers, for the two who go out on the internet (a screen is a line out of the office).
// Researcher: an old beige desktop. A CRT monitor (a flat front, a rounded housing tapering to the back) facing the
// chair, the tower beside it, a keyboard with its rows of keys in front, and a mouse.
const BEIGE = "#d9d0b9", BEIGE_DARK = "#bdb39b";
from = objects.length;
add({ id: "researcher-monitor-back", poly: [[705, 433], [740, 441], [740, 461], [705, 469]], z0: 77, z1: 110, color: BEIGE, group: "researcher-monitor" });
add({ id: "researcher-monitor", poly: roundRect(698, 429, 9, 44, 3), z0: 75, z1: 113, color: BEIGE });
turn(from, 720, 451, -3); from = objects.length;
add({ id: "researcher-tower", poly: roundRect(705, 380, 22, 44, 3.5), z0: 75, z1: 118, color: BEIGE });
turn(from, 716, 402, 2); from = objects.length;
add({ id: "researcher-keyboard", poly: roundRect(667, 428, 16, 46, 3), z0: 75, z1: 77.5, color: BEIGE });
for (let r = 0; r < 4; r++) flat("researcher-keys-" + r, roundRect(669 + r * 3.3, 431, 2.2, 40, 1), 77.6, BEIGE_DARK, "researcher-keyboard");
turn(from, 675, 451, 5); from = objects.length;
add({ id: "researcher-mouse", poly: ellipse(674, 486, 3.5, 5.5, 12), z0: 75, z1: 78.5, color: BEIGE });
turn(from, 674, 486, 14);
// Assistant: a laptop. The base with its keyboard and trackpad, a thin screen tipped back from the hinge.
const SILVER = "#cfcfcc";
from = objects.length;
add({ id: "assistant-laptop", poly: roundRect(180, 470, 38, 26, 3.5), z0: 74, z1: 75.6, color: SILVER });
flat("assistant-laptop-keys", roundRect(184, 481, 30, 12, 1.5), 75.7, "#a3a3a0", "assistant-laptop");
flat("assistant-laptop-pad", roundRect(193, 472.5, 12, 6.5, 1.5), 75.7, "#dcdcd9", "assistant-laptop");

const windows = [];   // no windows: the light is the office's own

// Daylight from the side, over the whole room (no windows, no roof in the way: walls cast no shadow).
// Its direction is the real sun's, with north at the top of the picture: from the right in the morning, from
// below at midday, from the left in the evening.
const UP = 0;

// --- the figure (one grey person walking an errand loop) --------------------------------------------
const route = [
  { p: [600, 104], pause: 2.5, face: Math.PI / 2 },               // at Director's desk
  { p: [300, 112] },
  { p: [160, 190] },
  { p: [126, 196], pause: 2.0, face: Math.PI, reach: true },      // Manager's inbox
  { p: [160, 190] },
  { p: [300, 112] },

const walker = { seg: 0, along: 0, pos: route[0].p.slice(), heading: -Math.PI / 2, wait: route[0].pause, turning: false, phase: 0, speed: 0, reachT: 0, gait: 0 };
const VMAX = 115, STRIDE = 62;

function segLen(i) { const a = route[i].p, b = route[(i + 1) % route.length].p; return Math.max(1e-6, Math.hypot(b[0] - a[0], b[1] - a[1])); }
function angleTo(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

// Distance left until the next stop (for slowing down), summed over pass-through points.
function distToStop() {
  let d = segLen(walker.seg) - walker.along, i = (walker.seg + 1) % route.length;
  while (!route[i].pause) { d += segLen(i); i = (i + 1) % route.length; }
  return d;
}
function distFromStop() {
  let d = walker.along, i = walker.seg;
  while (!route[i].pause) { i = (i - 1 + route.length) % route.length; d += segLen(i); }
  return d;
}

function stepWalker(dt) {
  const w = walker, here = route[w.seg];
  // How much of a walking gait the body shows: follows the speed with a short lag, so the feet settle
  // under the body over a few tenths of a second when it stops, and the first step grows out of standing.
  w.gait = lerp(w.gait, clamp(w.speed / 60, 0, 1), Math.min(1, dt * 7));
  if (w.wait > 0) {
    w.wait -= dt; w.speed = 0;
    if (here.face !== undefined) w.heading += angleTo(w.heading, here.face) * Math.min(1, dt * 6);
    w.reachT = here.reach ? Math.sin(Math.PI * clamp(1 - w.wait / here.pause, 0, 1)) : 0;
    if (w.wait <= 0) w.turning = true;
    return;
  }
  const a = route[w.seg].p, b = route[(w.seg + 1) % route.length].p;
  const dir = Math.atan2(b[1] - a[1], b[0] - a[0]);
  if (w.turning) { // turn towards the way out before walking
    const d = angleTo(w.heading, dir); w.heading += d * Math.min(1, dt * 7);
    if (Math.abs(d) < 0.25) w.turning = false;
    return;
  }
  // speed: ease in from a stop and out towards the next one
  const target = VMAX * clamp(Math.min(distFromStop() / 55, distToStop() / 70) + 0.15, 0.15, 1);
  w.speed = lerp(w.speed, target, Math.min(1, dt * 5));
  const ds = w.speed * dt;
  w.along += ds;
  w.heading += angleTo(w.heading, dir) * Math.min(1, dt * 8);
  const amp = clamp(w.speed / 60, 0, 1), S = 20 + (STRIDE - 20) * amp;
  w.phase = (w.phase + ds / (2 * S)) % 1;
  w.stride = S;
  if (w.along >= segLen(w.seg)) {
    w.along -= segLen(w.seg); w.seg = (w.seg + 1) % route.length;
    const r = route[w.seg];
    if (r.pause) { w.along = 0; w.pos = r.p.slice(); w.wait = r.pause; return; }
  }
  const s = route[w.seg].p, e = route[(w.seg + 1) % route.length].p, t = w.along / segLen(w.seg);
  w.pos = [lerp(s[0], e[0], t), lerp(s[1], e[1], t)];
}

// One foot over a stride cycle, relative to the body: planted during stance (moves back exactly as fast
// as the body moves forward, so it never slides), then swings forward with an ease.
function footOffset(phase, S) {
  if (phase < 0.5) return S / 2 - (phase / 0.5) * S;
  return -S / 2 + S * smooth((phase - 0.5) / 0.5);
}

function figureParts() {
  const w = walker, [x, y] = w.pos, h = w.heading;
  const f = [Math.cos(h), Math.sin(h)], s = [-Math.sin(h), Math.cos(h)];
  const at = (side, fwd) => [x + s[0] * side + f[0] * fwd, y + s[1] * side + f[1] * fwd];
  const moving = w.gait, S = w.stride || STRIDE;
  const offL = footOffset(w.phase, S) * moving, offR = footOffset((w.phase + 0.5) % 1, S) * moving;
  const twist = 0.10 * (offL / STRIDE);
  const bob = 1 + 0.014 * moving * (1 - Math.cos(4 * Math.PI * w.phase)) / 2;
  const reach = 20 * w.reachT;
  const ell = (cx, cy, a, b, rot, n = 18) => Array.from({ length: n }, (_, i) => {
    const t = 2 * Math.PI * i / n, ca = Math.cos(rot), sa = Math.sin(rot);
    const u = a * Math.cos(t), v = b * Math.sin(t); // u along the shoulders, v forwards
    const su = [s[0] * ca - f[0] * sa, s[1] * ca - f[1] * sa], fv = [f[0] * ca + s[0] * sa, f[1] * ca + s[1] * sa];
    return [cx + su[0] * u + fv[0] * v, cy + su[1] * u + fv[1] * v];
  });

  const limb = (id, bottom, top, z0, z1, color) => parts.push({ id, bottom, top, z0, z1, color, group: "figure", moves: true });
  for (const [side, off, name] of [[-10, offL, "l"], [10, offR, "r"]]) {
    const foot = at(side, off + 4), hip = at(side * 0.9, off * 0.25);
    limb("shoe-" + name, ell(foot[0], foot[1], 5.5, 13, 0, 10), ell(foot[0], foot[1], 5.5, 13, 0, 10), 0, 9, C.shoe);
    limb("leg-" + name, circle(foot[0], foot[1], 6.5, 8), circle(hip[0], hip[1], 8, 8), 9, 88, C.limb);
  }
  for (const [side, footOff, name] of [[-24, offR, "l"], [24, offL, "r"]]) { // each arm swings with the opposite foot
    const swing = 0.55 * footOff + reach;
    const shoulder = at(side, 0), hand = at(side * 1.08, swing);
    limb("arm-" + name, circle(hand[0], hand[1], 5, 8), circle(shoulder[0], shoulder[1], 6, 8), 82, 140, C.limb);
  }
  const torso = ell(x, y, 25 * bob, 14 * bob, twist);
  limb("torso", torso, torso, 88, 146, C.body);
  const hc = at(0, 2), head = ell(hc[0], hc[1], 10.5 * bob, 11.5 * bob, 0, 16);

}

// --- light ------------------------------------------------------------------------------------------
// A receiving surface: flat at height z, or tilted (the board, the calendar, a laptop's screen), a plane
// z = A + B·x + C·y. Shadows land on the surface itself, at its real height at every point.
const heightAt = (R, x, y) => R.plane ? R.plane.A + R.plane.B * x + R.plane.C * y : R.z;

// Where a corner of an occluder (at p, height z) lands on the receiver: along the sun's rays, or out from a lamp.
const sunProject = (L) => (p, z, R) => {
  let u = z - R.z;   // how far down the ray falls (flat receiver)
  if (R.plane) u = (z - heightAt(R, p[0], p[1])) / Math.max(0.05, 1 - (R.plane.B * L.sx + R.plane.C * L.sy) / L.tanE);
  return [p[0] - L.sx * u / L.tanE, p[1] - L.sy * u / L.tanE];
};
const lampProject = (L) => (p, z, R) => {
  z = Math.min(z, L.z - 0.8);  // a corner level with the lamp throws its shadow far, not to infinity
  let t = (L.z - R.z) / (L.z - z);
  if (R.plane) t = (R.plane.A + R.plane.B * L.x + R.plane.C * L.y - L.z) / ((z - L.z) - R.plane.B * (p[0] - L.x) - R.plane.C * (p[1] - L.y));
  return [L.x + (p[0] - L.x) * t, L.y + (p[1] - L.y) * t];
};

// The shadow of an occluder on a receiver: the hull of its corners, projected. Each upright edge counts only
// from where it rises above the receiver (so a leg under a tilted board doesn't shade the board).
function shadow(o, R, project, ztop = Infinity) {
  const z1 = Math.min(o.z1, ztop), span = o.z1 - o.z0;
  const bottom = o.bottom || o.poly, top = o.top || o.poly, pts = [];
  for (let i = 0; i < bottom.length; i++) {
    const at = (z) => { const k = span > 0 ? (z - o.z0) / span : 0; return [lerp(bottom[i][0], top[i][0], k), lerp(bottom[i][1], top[i][1], k)]; };
    const high = at(z1);
    if (z1 <= heightAt(R, high[0], high[1]) + 0.5) continue;      // this edge stays below the receiver
    const low = at(o.z0), zl = Math.max(o.z0, heightAt(R, low[0], low[1]));
    pts.push(project(at(zl), zl, R), project(high, z1, R));
  }
  return pts.length >= 3 ? hull(pts) : null;
}

// The patch of sun on the plane z = zr through one window: the opening seen through the wall's depth.
function sunPatch(win, zr, L) {
  if (L.el <= 0.3 || L.sx * win.n[0] + L.sy * win.n[1] <= 0) return null;
  const lo = Math.max(win.sill, zr), hi = win.top;
  if (hi <= lo + 1) return null;
  const proj = sunProject(L);
  const opening = (off) => {
    const a = [win.a[0] + win.n[0] * off, win.a[1] + win.n[1] * off], b = [win.b[0] + win.n[0] * off, win.b[1] + win.n[1] * off];
    return [proj(a, lo, zr), proj(b, lo, zr), proj(b, hi, zr), proj(a, hi, zr)];
  };
  const p = clip(hull(opening(0)), hull(opening(ROOM.wall)));
  return p.length >= 3 ? p : null;
}

// --- drawing ------------------------------------------------------------------------------------------
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
const layer = () => document.createElement("canvas");
const B = layer(), M = layer(), T = layer(), A = layer();  // base, one light's mask, scratch, all lamps' light
let dpr = 1, cssW = 1000, cssH = 700;

// The frame fills the window, with the room in the middle and at least PAD cm of floor around it on the
// tightest side. Redrawn from the geometry at the screen's own resolution: sharp on any screen.
const PAD = 150;
let view = { k: 1, ox: 0, oy: 0 };   // CSS pixels per cm, and where the room's corner sits on screen
function resize() {
  dpr = window.devicePixelRatio || 1;
  cssW = window.innerWidth || 1000; cssH = window.innerHeight || 700;
  const k = Math.min(cssW / (ROOM.w + 2 * PAD), cssH / (ROOM.h + 2 * PAD));
  view = { k, ox: (cssW - ROOM.w * k) / 2, oy: (cssH - ROOM.h * k) / 2 };
  for (const c of [canvas, B, M, T, A]) { c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr); }
  lampLayerKey = null;   // new layers: the lamps' light is made again (see draw)
  watchDensity();
}
let density = null;
function watchDensity() {
  if (density) density.removeEventListener("change", resize);
  density = matchMedia(`(resolution: ${dpr}dppx)`);
  density.addEventListener("change", resize);
}
window.addEventListener("resize", resize);
const toWorld = (g) => { const k = view.k * dpr; g.setTransform(k, 0, 0, k, view.ox * dpr, view.oy * dpr); };
function subpath(g, poly) { poly.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); }
function path(g, poly) { g.beginPath(); subpath(g, poly); }

function silhouette(o) { return o.bottom ? hull(o.bottom.concat(o.top)) : o.poly; }

// What of a thing takes light, seen from above. A slanted part (an arm, a leg) shows its whole length, so all of
// its silhouette takes light, at its middle height; anything else shows its top.
const slanted = (o) => o.bottom && o.bottom !== o.top;
function receiver(o) { return o.face || (slanted(o) ? silhouette(o) : o.top || o.poly); }

function drawBase(all) {
  const g = B.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, B.width, B.height); toWorld(g);
  for (const o of all) {
    path(g, o.shape || silhouette(o)); g.fillStyle = o.color; g.fill();
    if (o.id === "floor") drawGrid(g);   // on the floor, under everything standing on it
  }
}

// A light mask: alpha = how much of this light reaches each visible surface.
// How much sun a surface takes: a flat one FLAT_SUN, a tilted one more or less as it faces the sun or turns away
// (Lambert's law). This is what makes a tilted board read as tilted.
const FLAT_SUN = 0.8;
function facing(P, L) {
  const cosE = 1 / Math.sqrt(1 + L.tanE * L.tanE), sinE = L.tanE * cosE, len = Math.sqrt(P.B * P.B + P.C * P.C + 1);
  const d = (-P.B * L.sx * cosE - P.C * L.sy * cosE + sinE) / len;
  return clamp(FLAT_SUN * d / sinE, 0, 1);
}

const shadowCaches = new Map(); // per light: shadows between still things, kept until that light moves
function buildMask(all, surfaces, light) {
  let entry = shadowCaches.get(light.name);
  if (!entry || entry.key !== light.key) shadowCaches.set(light.name, entry = { key: light.key, map: new Map() });
  const cache = entry.map;
  const g = M.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, M.width, M.height); toWorld(g);
  const area = light.kind === "lamp" ? light.area : null;  // a lamp reaches no further than this, even on the floor
  const project = light.kind === "sun" ? sunProject(light) : lampProject(light);
  // Surfaces lowest first. Each one first hides what lies below it (its footprint is cleared), then gets its own
  // light. Every surface and every shadow is convex, so light patches and shadows are cut to the surface
  // exactly in JavaScript and filled as plain polygons: no canvas clipping, which is slow on the GPU.
  g.fillStyle = "#000";

    let sp = receiver(s), sb = bbox(sp);
    if (area) { // a lamp only works where its light reaches: the surface is cut to that square (the ground is huge)
      if (!overlaps(sb, area)) continue;
      sp = clip(sp, rect(area[0], area[1], area[2] - area[0], area[3] - area[1]));
      if (sp.length < 3) continue;
      sb = bbox(sp);
    }
    // Clear this surface's footprint, then add its own light. Adding (not painting over) makes the edge exact:
    // painting over would dim the anti-aliased edge twice and leave a faint dark seam between touching surfaces.
    g.globalCompositeOperation = "destination-out"; path(g, sp); g.fill();
    g.globalCompositeOperation = "lighter";
    const zr = s.zr ?? (slanted(s) ? (s.z0 + s.z1) / 2 : s.z1);
    const R = { z: zr, plane: s.plane || null }, lowest = s.plane ? s.planeMin : zr;
    let lit = false;
    if (light.kind === "sun") { // daylight reaches every surface; only things in its way shade it
      path(g, sp); g.fillStyle = `rgba(255,255,255,${(s.plane ? facing(s.plane, light) : FLAT_SUN).toFixed(3)})`; g.fill(); g.fillStyle = "#000"; lit = true;
    } else if (zr < light.z - 2 && s.group !== light.group) {
      const R = light.reach(zr);
      if (overlaps([light.x - R, light.y - R, light.x + R, light.y + R], sb)) { path(g, sp); g.fillStyle = light.gradient(g, zr); g.fill(); g.fillStyle = "#000"; lit = true; }
    }
    if (!lit) continue;
    g.globalCompositeOperation = "destination-out"; g.beginPath();
    let any = false;
    for (const o of all) {
      if (!o.occludes || o === s || o.group === light.group || o.z1 <= lowest + 0.5) continue;
      if (s.plane && o.group === s.group) continue;  // a board's own frame and legs don't shade its face
      if (o.shadeOnly && s.group !== o.shadeOnly) continue;  // small things that only shade their own furniture
      if (light.kind === "lamp" && o.z0 >= light.z) continue; // above the lamp: lit from below, no shadow downwards
      const still = !o.moves && !s.moves, key = s.id + "|" + o.id;
      let sh = still ? cache.get(key) : undefined;
      if (sh === undefined) {
        sh = shadow(o, R, project, light.kind === "lamp" ? light.z - 1 : Infinity);
        sh = sh && sh.length >= 3 && overlaps(bbox(sh), sb) ? clip(sh, sp) : null;
        if (sh && sh.length < 3) sh = null;
        if (still) cache.set(key, sh);
      }
      if (sh) { subpath(g, sh); any = true; }
    }
    if (any) g.fill();  // all of this surface's shadows in one fill
    g.globalCompositeOperation = "source-over";
  }
}

// Pixel rectangle on the layers for a rectangle in the world, clamped to the canvas.
function pixels([x0, y0, x1, y1]) {
  const k = view.k * dpr, X = (x) => x * k + view.ox * dpr, Y = (y) => y * k + view.oy * dpr;
  const px0 = clamp(Math.floor(X(x0)), 0, A.width), py0 = clamp(Math.floor(Y(y0)), 0, A.height);
  const px1 = clamp(Math.ceil(X(x1)), 0, A.width), py1 = clamp(Math.ceil(Y(y1)), 0, A.height);
  return [px0, py0, px1 - px0, py1 - py0];
}

// Add one lamp's mask to the lamps' shared light, only where that lamp reaches.
function accumulate(area) {
  const [x, y, w, h] = pixels(area);
  if (w <= 0 || h <= 0) return;
  const g = A.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = "lighter";
  g.drawImage(M, x, y, w, h, x, y, w, h);
  g.globalCompositeOperation = "source-over";
}

// Add one light to the picture: base × light colour × mask, added on top.
function addLight(color, strength, mask = M) {
  const g = T.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = "source-over"; g.clearRect(0, 0, T.width, T.height);
  g.drawImage(B, 0, 0);
  g.globalCompositeOperation = "multiply"; g.fillStyle = css(color, strength); g.fillRect(0, 0, T.width, T.height);
  g.globalCompositeOperation = "destination-in"; g.drawImage(mask, 0, 0);
  ctx.globalCompositeOperation = "lighter"; ctx.drawImage(T, 0, 0); ctx.globalCompositeOperation = "source-over";
}

// --- a lamp: light falls off with distance and angle (∝ h / d³), cut off by the shade ----------------------
// Brightness 1 is the light straight under the lamp at its reference height (for a desk lamp, the desk);
// each band is a flat ring where the light falls below a share of that.
const gradientCache = new Map();
function lampLight(l, soft) {
  const H = l.href, CONE = l.cone * Math.PI / 180, BANDS = l.bands;
  const rel = (h, r) => (h / Math.pow(h * h + r * r, 1.5)) * H * H;
  const radiusAt = (h, t) => Math.sqrt(Math.max(0, Math.pow(h * H * H / t, 2 / 3) - h * h));
  const reach = (zr) => Math.min((l.z - zr) * Math.tan(CONE), radiusAt(l.z - zr, soft ? 0.01 : BANDS[BANDS.length - 1][0]) + 1);
  return {
    kind: "lamp", name: l.group, key: "fixed", x: l.x, y: l.y, z: l.z, group: l.group, reach,
    area: [l.x - reach(0), l.y - reach(0), l.x + reach(0), l.y + reach(0)],
    gradient: (g, zr) => {
      const id = `${l.group}|${zr}|${soft}`;
      if (!gradientCache.has(id)) gradientCache.set(id, makeGradient(g, zr));
      return gradientCache.get(id);
    },
  };
  function makeGradient(g, zr) {
    const h = l.z - zr, R = reach(zr), grad = g.createRadialGradient(l.x, l.y, 0, l.x, l.y, R);
    const a = (v) => `rgba(255,255,255,${clamp(v, 0, 1).toFixed(3)})`;
    if (soft) {
      for (let i = 0; i <= 24; i++) { const r = R * i / 24, edge = 1 - smooth(clamp((r / R - 0.85) / 0.15, 0, 1)); grad.addColorStop(i / 24, a(Math.min(1, rel(h, r)) * edge)); }
      return grad;
    }
    let start = 0;
    for (const [t, v] of BANDS) {
      if (rel(h, 0) < t) continue;                 // this band never reaches this surface
      const r = Math.min(1, radiusAt(h, t) / R);
      if (r <= start) continue;
      grad.addColorStop(start, a(v)); grad.addColorStop(r, a(v));
      start = r;
      if (r >= 1) break;
    }
    if (start < 1) { grad.addColorStop(Math.min(1, start + 0.0005), a(0)); grad.addColorStop(1, a(0)); }
    return grad;
  }
}

// --- the controls and the loop --------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const state = { live: true, playing: false, minutes: 0, date: "" };
function syncNow() { // the clock follows real time, to the second
  const p = localParts(new Date());
  state.date = `${p.year}-${p.month}-${p.day}`; state.minutes = +p.hour * 60 + +p.minute + +p.second / 60;
  if ($("date").value !== state.date) $("date").value = state.date;
  $("time").value = Math.floor(state.minutes);
}
function setPlaying(on) { state.playing = on; $("play").textContent = on ? "Stoppa" : "Spela dygnet"; }
syncNow();
$("time").addEventListener("input", () => { state.live = false; setPlaying(false); state.minutes = +$("time").value; });
$("date").addEventListener("input", () => { if (/^\d{4}-\d{2}-\d{2}$/.test($("date").value)) { state.live = false; state.date = $("date").value; } });
$("now").addEventListener("click", () => { state.live = true; setPlaying(false); syncNow(); });
$("toggle").addEventListener("click", () => { const p = $("panel"); p.classList.toggle("hidden"); $("toggle").textContent = p.classList.contains("hidden") ? "Visa" : "Dölj"; });
$("play").addEventListener("click", () => { state.live = false; setPlaying(!state.playing); });

// The sun's highest point on a date, for the stylised angle (found once per date).
const noonCache = new Map();
function highest(date) {
  if (!noonCache.has(date)) { let m = -90; for (let k = 0; k < 96; k++) m = Math.max(m, sun(stockholm(date, k * 15)).el); noonCache.set(date, m); }
  return noonCache.get(date);
}

function lighting(minutes) {
  const s = sun(stockholm(state.date, minutes));
  // Real sunrise, sunset and direction; a stylised height, so the shadows read the same all year: about 32° at
  // dawn and dusk, 60° at midday (Stockholm's real sun is 7–53° at noon over the year).
  const progress = clamp(s.el / Math.max(1, highest(state.date)), 0, 1);
  const el = 32 + 28 * progress;   // as if the horizon were higher: shadows about 1.6 × an object's height at most
  const d = (s.az - UP) * Math.PI / 180, tanE = Math.tan(el * Math.PI / 180);
  const day = smooth(clamp((s.el + 4) / 6, 0, 1));            // dusk to day, around sunrise and sunset
  const K = 2100 + 3400 * smooth(clamp((el - 10) / 30, 0, 1));
  const sunColor = kelvin(K);
  // Clouds: less contrast. Less direct sun, more even light from the sky, a slightly cooler colour; the shadows
  // keep their shape and get lighter.
  const cloud = +$("clouds").value / 100;
  const color = mix(sunColor, kelvin(6500), 0.6 * cloud);
  const night = [0.12, 0.13, 0.20];
  const dayAmbient = mix(mix([0.40, 0.40, 0.42], sunColor.map(v => v * 0.45), 0.3 * (1 - progress)), [0.82, 0.83, 0.85], 0.8 * cloud);
  return {
    kind: "sun", name: "sun", key: `${s.az.toFixed(2)}|${el.toFixed(2)}`,
    el: s.el, az: s.az, K, sx: Math.sin(d), sy: -Math.cos(d), tanE, sunColor: color,
    sunStrength: 0.62 / FLAT_SUN * day * (1 - 0.75 * cloud), ambient: mix(night, dayAmbient, day), dark: s.el < 0,
  };
}

let last = performance.now(), lastSync = 0, failed = false;
let shownBg = null, lampLayerKey = null;

// All desk lamps' light, against the still room only, into one layer (A).
function buildLampLayer(soft) {
  const still = objects.slice().sort((a, b) => a.z1 - b.z1), surfaces = still.filter(o => o.receives !== false);
  const g = A.getContext("2d"); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, A.width, A.height);
  for (const l of lamps) { const light = lampLight(l, soft); buildMask(still, surfaces, light); accumulate(light.area); }
}
function frame(nowT) {
  requestAnimationFrame(frame);   // first, so one bad frame can't stop the animation
  try { draw(nowT); failed = false; }
  catch (e) { if (!failed) console.error(e); failed = true; }
}

function draw(nowT) {
  const dt = Math.min(0.05, (nowT - last) / 1000); last = nowT;
  if (state.live && nowT - lastSync > 1000) { syncNow(); lastSync = nowT; }
  else if (state.live) state.minutes += dt / 60;
  if (state.playing) { state.minutes = (state.minutes + dt * 1440 / 40) % 1440; $("time").value = Math.floor(state.minutes); }
  stepWalker(dt);

  const L = lighting(state.minutes), soft = $("mode").value === "soft";
  const all = objects.concat(figureParts()).sort((a, b) => a.z1 - b.z1);
  const surfaces = all.filter(o => o.receives !== false);

  drawBase(all);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(B, 0, 0);
  ctx.globalCompositeOperation = "multiply"; ctx.fillStyle = css(L.ambient); ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = "source-over";

  if (L.sunStrength > 0.01) { buildMask(all, surfaces, L); addLight(L.sunColor, L.sunStrength); }
  const lampsOn = $("lamps").value === "on" || ($("lamps").value === "auto" && L.dark);
  const warm = kelvin(2700);
  // The lamps and what they light stand still, so their light is worked out once, kept as a picture, and only
  // laid over the room while they're on. It's made ahead (at load, after a resize or a change of style), so
  // switching them on costs nothing. The walking figure takes the lamp light of where it stands.
  const lampKey = `${A.width}x${A.height}|${soft}`;
  if (lampKey !== lampLayerKey) { buildLampLayer(soft); lampLayerKey = lampKey; }
  if (lampsOn) addLight(warm, 1.05, A);

  // The page's background: the ground's colour in this light (ambient plus unshaded sun), so they meet seamlessly.
  const sunOn = L.sunStrength > 0.01, lit = rgb(BG).map((v, i) => v * (L.ambient[i] + (sunOn ? L.sunColor[i] * L.sunStrength * FLAT_SUN : 0)));
  const pageBg = css(lit), dark = lit[0] * 0.3 + lit[1] * 0.59 + lit[2] * 0.11 < 0.45;
  if (pageBg !== shownBg) { shownBg = pageBg; document.body.style.background = pageBg; }

  toWorld(ctx);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const hh = String(Math.floor(state.minutes / 60)).padStart(2, "0"), mm = String(Math.floor(state.minutes % 60)).padStart(2, "0");
  $("clock").textContent = `${hh}:${mm}${state.live ? " (nu)" : ""}`;
  $("info").textContent = `${state.date} ${hh}:${mm} · ` + (L.sunStrength > 0.01 ? `dagsljus från ${Math.round(L.az)}°, ${Math.round(L.K / 100) * 100} K` : "mörkt ute") +
    ` · skrivbordslampor ${lampsOn ? "på" : "av"}`;
}
resize();
requestAnimationFrame(frame);
</script>
