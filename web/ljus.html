<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ljusprototyp · Audax</title>
<style>
  /* A prototype: grey boxes and plain controls. None of this is the design. */
  body { margin: 0; background: #1c1c1c; color: #ddd; font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px 32px; }
  svg#c { display: block; width: 100%; height: auto; background: #111; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin: 10px 0; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  input[type=range] { width: min(420px, 80vw); }
  #info { color: #aaa; font-variant-numeric: tabular-nums; }
  a { color: #9bc; }
</style>
</head>
<body>
<main>
  <p><a href="/">← Kontoret</a> · Ljusprototyp: grå lådor, riktig sol för Stockholm, skrivbordslampor och en figur som går. Inget av det här är design.</p>
  <svg id="c" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="controls">
    <label>Tid <input id="time" type="range" min="0" max="1439" step="1"></label>
    <span id="clock"></span>
    <button id="now">Nu</button>
    <button id="play">Spela dygnet</button>
  </div>
  <div class="controls">
    <label>Datum <input id="date" type="date"></label>
    <label>Fönsterväggen vetter mot
      <select id="facing"><option value="180">söder</option><option value="270">väster</option><option value="90">öster</option><option value="0">norr</option></select>
    </label>
    <label>Lampor <select id="lamps"><option value="auto">när det är mörkt</option><option value="on">på</option><option value="off">av</option></select></label>
    <label>Ljus <select id="mode"><option value="band">i band</option><option value="soft">mjukt</option></select></label>
    <label><input id="debug" type="checkbox"> visa solens riktning</label>
  </div>
  <p id="info"></p>
</main>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// Units are centimetres. The room is seen from straight above: x right, y down, z up.
// Every object is a prism: a convex footprint at z0 and (for limbs) another at z1. Its shadow on a
// surface at height zr is the convex hull of its corners projected along the light onto that plane.
// ---------------------------------------------------------------------------------------------
const LAT = 59.33, LON = 18.07, TZ = "Europe/Stockholm";
const ROOM = { w: 900, h: 620, wall: 25, height: 270 };
const MARGIN = 70;
const WORLD = { x: -ROOM.wall - MARGIN, y: -ROOM.wall - MARGIN, w: ROOM.w + 2 * (ROOM.wall + MARGIN), h: ROOM.h + 2 * (ROOM.wall + MARGIN) };

// --- geometry ---------------------------------------------------------------------------------
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
const circle = (cx, cy, r, n = 16) => Array.from({ length: n }, (_, i) => [cx + r * Math.cos(2 * Math.PI * i / n), cy + r * Math.sin(2 * Math.PI * i / n)]);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);

function hull(points) { // monotone chain, counter-clockwise
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

function area(poly) { let a = 0; for (let i = 0; i < poly.length; i++) { const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length]; a += x1 * y2 - x2 * y1; } return a / 2; }

function clip(subject, clipper) { // Sutherland–Hodgman: convex ∩ convex
  if (area(clipper) < 0) clipper = clipper.slice().reverse();
  let out = subject;
  for (let i = 0; i < clipper.length && out.length; i++) {
    const a = clipper[i], b = clipper[(i + 1) % clipper.length];
    const inside = p => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]) >= 0;
    const meet = (p, q) => { const d1 = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]), d2 = (b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]); const t = d1 / (d1 - d2); return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]; };
    const input = out; out = [];
    for (let j = 0; j < input.length; j++) {
      const p = input[j], q = input[(j + 1) % input.length];
      if (inside(q)) { if (!inside(p)) out.push(meet(p, q)); out.push(q); } else if (inside(p)) out.push(meet(p, q));
    }
  }
  return out;
}

function bbox(poly) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const [x, y] of poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return [x0, y0, x1, y1]; }
const overlaps = (a, b) => a[0] <= b[2] && b[0] <= a[2] && a[1] <= b[3] && b[1] <= a[3];

// --- the sun (NOAA's low-precision formulas, good to a fraction of a degree) ----------------------
function sun(date) {
  const rad = Math.PI / 180, n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360, g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad, eps = (23.439 - 0.0000004 * n) * rad;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda)), dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const gmst = (18.697374558 + 24.06570982441908 * n) % 24, H = (gmst * 15 + LON) * rad - ra, phi = LAT * rad;
  const el = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(-Math.sin(H), Math.tan(dec) * Math.cos(phi) - Math.sin(phi) * Math.cos(H));
  return { el: el / rad, az: (az / rad + 360) % 360 };
}

function stockholm(dateStr, minutes) { // local wall time in Stockholm → the instant
  const [Y, M, D] = dateStr.split("-").map(Number);
  const guess = Date.UTC(Y, M - 1, D, Math.floor(minutes / 60), minutes % 60);
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
    .formatToParts(new Date(guess)).map(p => [p.type, p.value]));
  const shown = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute);
  return new Date(guess - (shown - guess));
}

function kelvin(k) { // Tanner Helland's approximation, 0..1
  const t = k / 100;
  const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  const b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  return [r, g, b].map(v => clamp(v, 0, 255) / 255);
}
const mix = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
const css = (c, k = 1) => `rgb(${c.map(v => Math.round(clamp(v * k, 0, 1) * 255)).join(",")})`;

// --- the room -------------------------------------------------------------------------------------
const C = { floor: "#d6d1c7", outside: "#b9bcb0", wall: "#3b3a38", sill: "#8d8a84", glass: "#a9c4cf", desk: "#b3aca0", chair: "#8a857d",
  cabinet: "#9c968c", tray: "#c9c3b8", paper: "#efece6", lamp: "#77736c", shade: "#e4ded2", screen: "#4b4a48", keys: "#7c7973", board: "#a59a86",
  body: "#6e6a64", head: "#56524d", limb: "#625e58", shoe: "#46433f" };

const objects = [];   // static: { id, poly, z0, z1, color, top?, group, occludes, receives }
const add = (o) => { objects.push(Object.assign({ occludes: true, receives: true, group: o.id }, o)); };

add({ id: "floor", poly: rect(0, 0, ROOM.w, ROOM.h), z0: 0, z1: 0, color: C.floor, occludes: false });
const desks = [
  { role: "assistant", x: 140, y: 170 }, { role: "director", x: 600, y: 170 },
  { role: "researcher", x: 140, y: 400 }, { role: "manager", x: 600, y: 400 },
];
const lamps = [];
for (const d of desks) {
  const g = d.role, W = 160, H = 80, cx = d.x + W / 2;
  add({ id: g + "-desk", poly: rect(d.x, d.y, W, H), z0: 0, z1: 75, color: C.desk });
  add({ id: g + "-seat", poly: rect(cx - 24, d.y + H + 10, 48, 44), z0: 0, z1: 47, color: C.chair });
  add({ id: g + "-back", poly: rect(cx - 24, d.y + H + 54, 48, 8), z0: 47, z1: 92, color: C.chair });
  add({ id: g + "-tray", poly: rect(d.x + W - 46, d.y + 10, 34, 26), z0: 75, z1: 83, color: C.tray });
  add({ id: g + "-paper", poly: rect(cx - 8, d.y + 28, 21, 30), z0: 75, z1: 75.4, color: C.paper, occludes: false });
  const lx = d.x + 26, ly = d.y + 22;
  add({ id: g + "-lampbase", poly: circle(lx, ly, 9, 12), z0: 75, z1: 78, color: C.lamp, group: g + "-lamp" });
  add({ id: g + "-lamppole", poly: circle(lx, ly, 1.6, 6), z0: 78, z1: 112, color: C.lamp, group: g + "-lamp" });
  add({ id: g + "-shade", poly: circle(lx, ly, 12, 16), z0: 112, z1: 126, color: C.shade, group: g + "-lamp" });
  lamps.push({ role: g, x: lx, y: ly, z: 113, group: g + "-lamp" });
}
// The Assistant alone has a screen and a keyboard: its line to the owner.
add({ id: "assistant-screen", poly: rect(190, 182, 60, 7), z0: 82, z1: 124, color: C.screen });
add({ id: "assistant-stand", poly: rect(210, 186, 20, 14), z0: 75, z1: 82, color: C.screen });
add({ id: "assistant-keys", poly: rect(193, 212, 50, 15), z0: 75, z1: 77, color: C.keys, occludes: false });
add({ id: "cabinet", poly: rect(380, 0, 140, 50), z0: 0, z1: 135, color: C.cabinet });
add({ id: "board", poly: rect(ROOM.w - 8, 230, 8, 170), z0: 100, z1: 195, color: C.board });

// Windows: an opening in a wall, from the sill to the top. a→b along the inner face, n = outwards.
const windows = [
  { a: [160, ROOM.h], b: [320, ROOM.h], n: [0, 1], sill: 85, top: 225 },
  { a: [560, ROOM.h], b: [740, ROOM.h], n: [0, 1], sill: 85, top: 225 },
  { a: [0, 230], b: [0, 390], n: [-1, 0], sill: 85, top: 225 },
];

// --- the figure (one grey person walking an errand loop) --------------------------------------------
const route = [
  { p: [290, 300], pause: 2.5, face: -Math.PI / 2 },      // beside the Assistant's desk
  { p: [450, 335] },
  { p: [735, 335] },
  { p: [735, 292], pause: 2.0, face: -Math.PI / 2, reach: true },  // the Director's inbox
  { p: [735, 335] },
  { p: [450, 335] },
  { p: [450, 100], pause: 2.4, face: -Math.PI / 2, reach: true },  // the file cabinet
  { p: [450, 335] },
];
const walker = { seg: 0, along: 0, pos: route[0].p.slice(), heading: -Math.PI / 2, wait: route[0].pause, turning: false, phase: 0, speed: 0, reachT: 0 };
const VMAX = 115, STRIDE = 62;

function segLen(i) { const a = route[i].p, b = route[(i + 1) % route.length].p; return Math.hypot(b[0] - a[0], b[1] - a[1]); }
function angleTo(a, b) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; }

// Distance left until the next stop (for slowing down), summed over pass-through points.
function distToStop() {
  let d = segLen(walker.seg) - walker.along, i = (walker.seg + 1) % route.length;
  while (!route[i].pause) { d += segLen(i); i = (i + 1) % route.length; }
  return d;
}
function distFromStop() {
  let d = walker.along, i = walker.seg;
  while (!route[i].pause) { i = (i - 1 + route.length) % route.length; d += segLen(i); }
  return d;
}

function stepWalker(dt) {
  const w = walker, here = route[w.seg];
  if (w.wait > 0) {
    w.wait -= dt; w.speed = 0;
    if (here.face !== undefined) w.heading += angleTo(w.heading, here.face) * Math.min(1, dt * 6);
    w.reachT = here.reach ? Math.sin(Math.PI * clamp(1 - w.wait / here.pause, 0, 1)) : 0;
    if (w.wait <= 0) w.turning = true;
    return;
  }
  const a = route[w.seg].p, b = route[(w.seg + 1) % route.length].p;
  const dir = Math.atan2(b[1] - a[1], b[0] - a[0]);
  if (w.turning) { // turn towards the way out before walking
    const d = angleTo(w.heading, dir); w.heading += d * Math.min(1, dt * 7);
    if (Math.abs(d) < 0.25) w.turning = false;
    return;
  }
  // speed: ease in from a stop and out towards the next one
  const target = VMAX * clamp(Math.min(distFromStop() / 55, distToStop() / 70) + 0.15, 0.15, 1);
  w.speed = lerp(w.speed, target, Math.min(1, dt * 5));
  const ds = w.speed * dt;
  w.along += ds;
  w.heading += angleTo(w.heading, dir) * Math.min(1, dt * 8);
  const amp = clamp(w.speed / 60, 0, 1), S = 20 + (STRIDE - 20) * amp;
  w.phase = (w.phase + ds / (2 * S)) % 1;
  w.stride = S;
  if (w.along >= segLen(w.seg)) {
    w.along -= segLen(w.seg); w.seg = (w.seg + 1) % route.length;
    const r = route[w.seg];
    if (r.pause) { w.along = 0; w.pos = r.p.slice(); w.wait = r.pause; return; }
  }
  const s = route[w.seg].p, e = route[(w.seg + 1) % route.length].p, t = w.along / segLen(w.seg);
  w.pos = [lerp(s[0], e[0], t), lerp(s[1], e[1], t)];
}

// One foot over a stride cycle, relative to the body: planted during stance (moves back exactly as fast
// as the body moves forward, so it never slides), then swings forward with an ease.
function footOffset(phase, S) {
  if (phase < 0.5) return S / 2 - (phase / 0.5) * S;
  return -S / 2 + S * smooth((phase - 0.5) / 0.5);
}

function figureParts() {
  const w = walker, [x, y] = w.pos, h = w.heading;
  const f = [Math.cos(h), Math.sin(h)], s = [-Math.sin(h), Math.cos(h)];
  const at = (side, fwd) => [x + s[0] * side + f[0] * fwd, y + s[1] * side + f[1] * fwd];
  const moving = w.speed > 3 ? clamp(w.speed / 60, 0, 1) : 0, S = w.stride || STRIDE;
  const offL = footOffset(w.phase, S) * moving, offR = footOffset((w.phase + 0.5) % 1, S) * moving;
  const twist = 0.10 * (offL / STRIDE);
  const bob = 1 + 0.014 * moving * (1 - Math.cos(4 * Math.PI * w.phase)) / 2;
  const reach = 20 * w.reachT;
  const ell = (cx, cy, a, b, rot, n = 18) => Array.from({ length: n }, (_, i) => {
    const t = 2 * Math.PI * i / n, ca = Math.cos(rot), sa = Math.sin(rot);
    const u = a * Math.cos(t), v = b * Math.sin(t); // u along the shoulders, v forwards
    const su = [s[0] * ca - f[0] * sa, s[1] * ca - f[1] * sa], fv = [f[0] * ca + s[0] * sa, f[1] * ca + s[1] * sa];
    return [cx + su[0] * u + fv[0] * v, cy + su[1] * u + fv[1] * v];
  });
  const parts = [];
  const limb = (id, bottom, top, z0, z1, color) => parts.push({ id, bottom, top, z0, z1, color, group: "figure" });
  for (const [side, off, name] of [[-10, offL, "l"], [10, offR, "r"]]) {
    const foot = at(side, off + 4), hip = at(side * 0.9, off * 0.25);
    limb("shoe-" + name, ell(foot[0], foot[1], 5.5, 13, 0, 10), ell(foot[0], foot[1], 5.5, 13, 0, 10), 0, 9, C.shoe);
    limb("leg-" + name, circle(foot[0], foot[1], 6.5, 8), circle(hip[0], hip[1], 8, 8), 9, 88, C.limb);
  }
  for (const [side, footOff, name] of [[-24, offR, "l"], [24, offL, "r"]]) { // each arm swings with the opposite foot
    const swing = 0.55 * footOff + reach;
    const shoulder = at(side, 0), hand = at(side * 1.08, swing);
    limb("arm-" + name, circle(hand[0], hand[1], 5, 8), circle(shoulder[0], shoulder[1], 6, 8), 82, 140, C.limb);
  }
  const torso = ell(x, y, 25 * bob, 14 * bob, twist);
  limb("torso", torso, torso, 88, 146, C.body);
  const hc = at(0, 2), head = ell(hc[0], hc[1], 10.5 * bob, 11.5 * bob, 0, 16);
  limb("head", head, head, 146, 172, C.head);
  return parts;
}

// --- light ------------------------------------------------------------------------------------------
// Where a corner of an occluder lands on the plane z = zr: along the sun's rays, or out from a lamp.
const sunProject = (L) => (p, z, zr) => [p[0] - L.sx * (z - zr) / L.tanE, p[1] - L.sy * (z - zr) / L.tanE];
const lampProject = (L) => (p, z, zr) => { const k = (L.z - zr) / Math.max(0.8, L.z - z); return [L.x + (p[0] - L.x) * k, L.y + (p[1] - L.y) * k]; };

function shadow(o, zr, project, ztop = Infinity) {
  const z1 = Math.min(o.z1, ztop);
  if (z1 <= zr + 0.5) return null;
  const zl = Math.max(o.z0, zr);
  const t = o.z1 > o.z0 ? (zl - o.z0) / (o.z1 - o.z0) : 0;
  const u = o.z1 > o.z0 ? (z1 - o.z0) / (o.z1 - o.z0) : 1;
  const bottom = o.bottom || o.poly, top = o.top || o.poly;
  const at = (k) => bottom.map((p, i) => [lerp(p[0], top[i][0], k), lerp(p[1], top[i][1], k)]);
  const pts = [];
  for (const p of at(t)) pts.push(project(p, zl, zr));
  for (const p of at(u)) pts.push(project(p, z1, zr));
  return hull(pts);
}

// The patch of sun on the plane z = zr through one window: the opening seen through the wall's depth.
function sunPatch(win, zr, L) {
  if (L.el <= 0.3 || L.sx * win.n[0] + L.sy * win.n[1] <= 0) return null;
  const lo = Math.max(win.sill, zr), hi = win.top;
  if (hi <= lo + 1) return null;
  const proj = sunProject(L);
  const opening = (off) => {
    const a = [win.a[0] + win.n[0] * off, win.a[1] + win.n[1] * off], b = [win.b[0] + win.n[0] * off, win.b[1] + win.n[1] * off];
    return [proj(a, lo, zr), proj(b, lo, zr), proj(b, hi, zr), proj(a, hi, zr)];
  };
  const p = clip(hull(opening(0)), hull(opening(ROOM.wall)));
  return p.length >= 3 ? p : null;
}

// --- the controls and the loop --------------------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const state = { live: true, playing: false, minutes: 0, date: "" };
function syncNow() {
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
    .formatToParts(new Date()).map(p => [p.type, p.value]));
  state.date = `${parts.year}-${parts.month}-${parts.day}`; state.minutes = +parts.hour * 60 + +parts.minute;
  $("date").value = state.date; $("time").value = state.minutes;
}
syncNow();
$("time").addEventListener("input", () => { state.live = false; state.playing = false; state.minutes = +$("time").value; });
$("date").addEventListener("input", () => { state.live = false; state.date = $("date").value; });
$("now").addEventListener("click", () => { state.live = true; state.playing = false; syncNow(); });
$("play").addEventListener("click", () => { state.live = false; state.playing = !state.playing; $("play").textContent = state.playing ? "Stoppa" : "Spela dygnet"; });

function lighting(minutes) {
  const s = sun(stockholm(state.date, Math.floor(minutes)));
  const facing = +$("facing").value;            // compass bearing the window wall (bottom of the screen) faces
  const up = (facing + 180) % 360, d = (s.az - up) * Math.PI / 180;
  const el = s.el, tanE = Math.tan(Math.max(0.5, el) * Math.PI / 180);
  const day = smooth(clamp((el + 6) / 16, 0, 1));          // 0 at night, 1 once the sun is 10° up
  const low = 1 - smooth(clamp((el - 2) / 25, 0, 1));      // how golden the light is
  const K = 1900 + 3700 * smooth(clamp(el / 35, 0, 1));
  const sunColor = kelvin(K);
  const night = [0.17, 0.19, 0.29], dusk = [0.32, 0.33, 0.45], noon = [0.50, 0.51, 0.53];
  let ambient = el < 0 ? mix(night, dusk, smooth(clamp((el + 8) / 8, 0, 1))) : mix(dusk, noon, smooth(clamp(el / 12, 0, 1)));
  ambient = mix(ambient, sunColor.map(v => v * 0.42), 0.35 * low * day);
  return { el, az: s.az, K, sx: Math.sin(d), sy: -Math.cos(d), tanE, sunColor, sunStrength: 0.58 * smooth(clamp(el / 6, 0, 1)), ambient, dark: day < 0.75 };
}

// --- drawing: everything is SVG, so it stays sharp at any zoom ------------------------------------------
// The scene is drawn once in the ambient light, and once more per light source with that light's colour.
// Each light's copy is masked by a vector mask (white where the light reaches, black in shadow) and added
// on top (plus-lighter): picture = base × ambient + Σ base × light × mask.
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs || {}) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const svg = $("c");
svg.setAttribute("viewBox", `${WORLD.x} ${WORLD.y} ${WORLD.w} ${WORLD.h}`);
const defs = el("defs", {}, svg);
const f1 = (v) => (Math.round(v * 10) / 10).toString();
const pd = (poly) => poly && poly.length >= 3 ? "M" + poly.map(([x, y]) => f1(x) + " " + f1(y)).join("L") + "Z" : "";
function set(node, name, value) { const k = "_" + name; if (node[k] !== value) { node[k] = value; node.setAttribute(name, value); } }
const rgb = (hex) => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
const tint = (hex, light) => css(rgb(hex).map((v, i) => v * light[i]));

function silhouette(o) { return o.bottom ? hull(o.bottom.concat(o.top)) : o.poly; }

// What the scene is made of, in drawing order: the static room, then the figure, then the walls on top.
const FIGURE = figureParts().sort((a, b) => a.z1 - b.z1).map(p => p.id);
const STATIC = objects.slice().sort((a, b) => a.z1 - b.z1);
const W = ROOM.wall;
const wallRects = [[-W, -W, ROOM.w + 2 * W, W], [ROOM.w, -W, W, ROOM.h + 2 * W], [-W, -W, W, 230 + W], [-W, 390, W, ROOM.h - 390 + W],
  [-W, ROOM.h, 160 + W, W], [320, ROOM.h, 240, W], [740, ROOM.h, ROOM.w - 740 + W, W]];
const sills = windows.map(w => w.n[1] ? [Math.min(w.a[0], w.b[0]), w.a[1], Math.abs(w.b[0] - w.a[0]), W] : [w.a[0] - W, Math.min(w.a[1], w.b[1]), W, Math.abs(w.b[1] - w.a[1])]);
const glass = windows.map(w => w.n[1] ? [w.a[0], w.a[1] + W / 2, w.b[0], w.b[1] + W / 2] : [w.a[0] - W / 2, w.a[1], w.b[0] - W / 2, w.b[1]]);

// One copy of the scene, its colours multiplied by one light.
function sceneCopy(parent) {
  const nodes = [], figure = {};
  const add = (node, color, attr = "fill") => nodes.push({ node, color, attr });
  add(el("rect", { x: WORLD.x, y: WORLD.y, width: WORLD.w, height: WORLD.h }, parent), C.outside);
  for (const o of STATIC) add(el("path", { d: pd(silhouette(o)) }, parent), o.color);
  for (const id of FIGURE) { const p = el("path", {}, parent); figure[id] = p; add(p, null); }
  for (const r of wallRects) add(el("rect", { x: r[0], y: r[1], width: r[2], height: r[3] }, parent), C.wall);
  for (const r of sills) add(el("rect", { x: r[0], y: r[1], width: r[2], height: r[3] }, parent), C.sill);
  for (const g of glass) add(el("line", { x1: g[0], y1: g[1], x2: g[2], y2: g[3], "stroke-width": 3 }, parent), C.glass, "stroke");
  return { nodes, figure, light: null,
    update(light, parts) {
      for (const p of parts) set(this.figure[p.id], "d", pd(silhouette(p)));
      const key = light.join(",");
      if (key === this.light) return;
      this.light = key;
      for (const n of this.nodes) if (n.color) set(n.node, n.attr, tint(n.color, light));
      for (const p of parts) set(this.figure[p.id], "fill", tint(p.color, light));
    } };
}

// A clip path per surface: the visible top of each thing, which hides whatever lies below it.
const surfaceIds = STATIC.filter(o => o.receives).map(o => o.id).concat(FIGURE);
const clips = {};
for (const id of surfaceIds) { const c = el("clipPath", { id: "s-" + id }, defs); clips[id] = el("path", {}, c); }
for (const o of STATIC) if (o.receives) set(clips[o.id], "d", pd(o.poly));

// One mask per light: per surface (lowest first) clear, light it, cut out the shadows.
function lightMask(id, outdoors) {
  const m = el("mask", { id, maskUnits: "userSpaceOnUse", x: WORLD.x, y: WORLD.y, width: WORLD.w, height: WORLD.h }, defs);
  if (outdoors) { // outdoors is in full sun; indoors only what comes through the windows
    el("rect", { x: WORLD.x, y: WORLD.y, width: WORLD.w, height: WORLD.h, fill: "#fff" }, m);
    el("rect", { x: -W, y: -W, width: ROOM.w + 2 * W, height: ROOM.h + 2 * W, fill: "#000" }, m);
  }
  const per = {};
  for (const sid of surfaceIds) {
    const g = el("g", { "clip-path": `url(#s-${sid})` }, m);
    per[sid] = {
      clear: el("rect", { x: WORLD.x, y: WORLD.y, width: WORLD.w, height: WORLD.h, fill: "#000" }, g),
      lit: outdoors ? el("path", { fill: "#fff" }, g) : el("rect", { x: 0, y: 0, width: 0, height: 0 }, g),
      shade: el("path", { fill: "#000" }, g),
    };
  }
  return per;
}

// The layers, bottom to top.
const ambientLayer = sceneCopy(el("g", {}, svg));
const sunGroup = el("g", { mask: "url(#m-sun)", style: "mix-blend-mode: plus-lighter" }, svg);
const sunLayer = sceneCopy(sunGroup), sunMask = lightMask("m-sun", true);
const lampLayers = lamps.map((l, i) => {
  const g = el("g", { mask: `url(#m-lamp${i})`, style: "mix-blend-mode: plus-lighter" }, svg);
  return { g, scene: sceneCopy(g), mask: lightMask("m-lamp" + i, false) };
});
const glows = el("g", {}, svg), debugLayer = el("g", {}, svg);
const glowNodes = lamps.map(l => el("path", { d: pd(circle(l.x, l.y, 12, 16)) }, glows));

// Shadows and light, surface by surface.
function fillMask(per, all, light) {
  const project = light.kind === "sun" ? sunProject(light) : lampProject(light);
  for (const s of all) {
    if (!per[s.id]) continue;
    const parts = per[s.id], zr = s.z1, sb = bbox(s.top || s.poly);
    let lit = false;
    if (light.kind === "sun") {
      const patches = windows.map(w => sunPatch(w, zr, light)).filter(p => p && overlaps(bbox(p), sb));
      set(parts.lit, "d", patches.map(pd).join(""));
      lit = patches.length > 0;
    } else {
      const R = light.reach(zr);
      lit = zr < light.z - 2 && s.group !== light.group && overlaps([light.x - R, light.y - R, light.x + R, light.y + R], sb);
      if (lit) {
        set(parts.lit, "x", f1(light.x - R)); set(parts.lit, "y", f1(light.y - R));
        set(parts.lit, "width", f1(2 * R)); set(parts.lit, "height", f1(2 * R)); set(parts.lit, "fill", `url(#${light.gradient(zr)})`);
      } else set(parts.lit, "width", "0");
    }
    let shade = "";
    if (lit) for (const o of all) {
      if (!o.occludes || o === s || o.group === light.group || o.z1 <= zr + 0.5) continue;
      if (light.kind === "lamp" && o.z0 >= light.z) continue; // above the lamp: lit from below, no shadow downwards
      const sh = shadow(o, zr, project, light.kind === "lamp" ? light.z - 1 : Infinity);
      if (sh && sh.length >= 3 && overlaps(bbox(sh), sb)) shade += pd(sh);
    }
    set(parts.shade, "d", shade);
  }
}

// --- a desk lamp: light falls off with distance and angle (∝ h / d³), cut off by the shade ----------
const BANDS = [[0.45, 1.0], [0.16, 0.62], [0.05, 0.34], [0.016, 0.16]]; // [share of the light under the lamp, brightness]
const H_REF = 113 - 75, CONE = 74 * Math.PI / 180;  // half the opening angle of the shade
const gradients = {};
function lampLight(l, i, soft) {
  const rel = (h, r) => (h / Math.pow(h * h + r * r, 1.5)) * H_REF * H_REF;
  const radiusAt = (h, t) => Math.sqrt(Math.max(0, Math.pow(h * H_REF * H_REF / t, 2 / 3) - h * h));
  const reach = (zr) => (l.z - zr) * Math.tan(CONE);
  return {
    kind: "lamp", x: l.x, y: l.y, z: l.z, group: l.group, reach,
    gradient(zr) { // a radial gradient per lamp and surface height, made once
      const id = `g${i}-${f1(zr).replace(".", "_")}-${soft ? "s" : "b"}`;
      if (gradients[id]) return id;
      const h = l.z - zr, R = reach(zr), stops = [];
      if (soft) {
        for (let k = 0; k <= 24; k++) { const r = R * k / 24, edge = 1 - smooth(clamp((r / R - 0.85) / 0.15, 0, 1)); stops.push([k / 24, Math.min(1, rel(h, r)) * edge]); }
      } else { // each band is a flat ring: a hard step where the light falls below the band's share
        let start = 0;
        for (const [t, v] of BANDS) {
          if (rel(h, 0) < t) continue;
          const r = Math.min(1, radiusAt(h, t) / R);
          if (r <= start) continue;
          stops.push([start, v], [r, v]);
          start = r;
          if (r >= 1) break;
        }
        stops.push([Math.min(1, start), 0], [1, 0]);
      }
      const g = el("radialGradient", { id, gradientUnits: "userSpaceOnUse", cx: l.x, cy: l.y, r: f1(R) }, defs);
      for (const [o, v] of stops) el("stop", { offset: o.toFixed(4), "stop-color": "#fff", "stop-opacity": clamp(v, 0, 1).toFixed(3) }, g);
      gradients[id] = g;
      return id;
    },
  };
}

let last = performance.now();
function frame(nowT) {
  const dt = Math.min(0.05, (nowT - last) / 1000); last = nowT;
  if (state.live && Math.floor(nowT / 1000) % 20 === 0) syncNow();
  if (state.playing) { state.minutes = (state.minutes + dt * 1440 / 40) % 1440; $("time").value = Math.floor(state.minutes); }
  stepWalker(dt);

  const L = lighting(state.minutes), soft = $("mode").value === "soft";
  const parts = figureParts();
  const all = objects.concat(parts).sort((a, b) => a.z1 - b.z1);
  for (const p of parts) set(clips[p.id], "d", pd(p.top));

  ambientLayer.update(L.ambient, parts);
  const sunOn = L.sunStrength > 0.01;
  sunGroup.style.display = sunOn ? "" : "none";
  if (sunOn) { sunLayer.update(L.sunColor.map(v => v * L.sunStrength), parts); fillMask(sunMask, all, Object.assign({ kind: "sun" }, L)); }
  const lampsOn = $("lamps").value === "on" || ($("lamps").value === "auto" && L.dark);
  const warm = kelvin(2700);
  lampLayers.forEach((layer, i) => {
    layer.g.style.display = lampsOn ? "" : "none";
    if (lampsOn) { layer.scene.update(warm.map(v => v * 1.05), parts); fillMask(layer.mask, all, lampLight(lamps[i], i, soft)); }
  });
  glows.style.display = lampsOn ? "" : "none";
  for (const g of glowNodes) set(g, "fill", css(warm));

  debugLayer.replaceChildren();
  if ($("debug").checked && L.el > 0) {
    const cx = ROOM.w / 2, cy = ROOM.h / 2, len = 160;
    el("line", { x1: cx, y1: cy, x2: cx + L.sx * len, y2: cy + L.sy * len, stroke: "#e33", "stroke-width": 3 }, debugLayer);
    el("text", { x: cx + L.sx * len + 6, y: cy + L.sy * len, fill: "#e33", "font-size": 16 }, debugLayer).textContent = "mot solen";
    for (const w of windows) { const p = sunPatch(w, 0, L); if (p) el("path", { d: pd(p), fill: "none", stroke: "#e33" }, debugLayer); }
  }

  const hh = String(Math.floor(state.minutes / 60)).padStart(2, "0"), mm = String(Math.floor(state.minutes % 60)).padStart(2, "0");
  $("clock").textContent = `${hh}:${mm}${state.live ? " (nu)" : ""}`;
  $("info").textContent = `Stockholm ${state.date} ${hh}:${mm} · solen ${L.el.toFixed(1)}° över horisonten, bäring ${L.az.toFixed(0)}° · ` +
    (L.el > 0 ? `ljusets färg ${Math.round(L.K / 100) * 100} K` : "solen är nere") + ` · lampor ${lampsOn ? "på" : "av"}`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
