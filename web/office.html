<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audax office</title>
<style>
  /* The office fills the window; the test settings sit in a small panel on top for now. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f8f8f7; font: 13px/1.4 system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #panel { position: fixed; left: 12px; bottom: 12px; max-width: min(520px, calc(100vw - 24px)); padding: 8px 12px; border-radius: 8px;
    background: rgba(255, 255, 255, 0.82); color: #333; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); }
  #panel.hidden .body { display: none; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin: 6px 0; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  #time { width: min(300px, 60vw); }
  #veil { position: fixed; inset: 0; background: rgba(20, 20, 24, 0.28); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #veil.hidden { display: none; }
  #sheet { width: min(760px, 100%); max-height: min(84vh, 900px); overflow: auto; padding: 22px 26px 26px; border-radius: 16px;
    background: #fbfaf7; color: #2b2b2b; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25); position: relative; }
  #sheet h2 { margin: 0 0 2px; font-size: 22px; font-weight: 600; } #sheet h3 { margin: 22px 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: #8a8478; }
  #sheet .muted { color: #8a8478; } #sheet .status { margin: 10px 0 0; }
  #sheet ul.plain { list-style: none; margin: 0; padding: 0; } #sheet ul.plain > li { padding: 7px 0; border-top: 1px solid #ece8e0; }
  #sheet .row { display: flex; gap: 10px; align-items: baseline; } #sheet .when { color: #8a8478; min-width: 92px; font-variant-numeric: tabular-nums; }
  #sheet details { margin: 4px 0; } #sheet summary { cursor: pointer; }
  #sheet .work { cursor: pointer; } #sheet .work:hover .what { text-decoration: underline; }
  #sheet .detail { margin: 8px 0 4px 102px; } #sheet .day { margin: 16px 0 2px; font-weight: 600; font-size: 13px; }
  #sheet .text { white-space: pre-wrap; } #sheet .notes { white-space: pre-wrap; background: #f3f0e9; padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
  #sheet pre.diff { white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, monospace; background: #f3f0e9; padding: 8px 10px; border-radius: 8px; margin: 6px 0; }
  #sheet .add { background: #dff0d8; display: block; } #sheet .del { background: #f6dcd6; display: block; } #sheet .file { font-weight: 600; display: block; margin-top: 6px; }
  #sheet .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #ece8e0; color: #6f695e; margin-left: 6px; }
  #sheet .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #5aa36a; margin-right: 6px; }
  #close { position: sticky; top: 0; float: right; border: 0; background: none; font-size: 24px; line-height: 1; cursor: pointer; color: #8a8478; }
  #roles { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px 18px; flex-wrap: wrap; justify-content: center;
    max-width: calc(100vw - 24px); padding: 7px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.8); color: #2b2b2b; font-size: 13px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1); pointer-events: none; }
  #roles .who { font-weight: 600; } #roles .ago { color: #8a8478; } #roles .busy { color: #3f8a52; }
  #info { color: #666; font-variant-numeric: tabular-nums; margin: 4px 0 0; }
  a { color: #47a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="roles"></div>
<div id="veil" class="hidden"><div id="sheet" role="dialog" aria-modal="true"><button id="close" aria-label="Close">×</button><div id="sheet-body"></div></div></div>
<div id="panel">
  <div><a href="/data/">Data →</a> · test settings · <button id="toggle">Hide</button></div>
  <div class="body">
    <div class="controls">
      <label>Time <input id="time" type="range" min="0" max="1439" step="1"></label>
      <span id="clock"></span>
      <button id="now">Now</button>
      <button id="play">Play the day</button>
    </div>
    <div class="controls">
      <label>Date <input id="date" type="date"></label>
      <label>Clouds <input id="clouds" type="range" min="0" max="100" value="0" style="width: 110px"></label>
      <label>Lamps <select id="lamps"><option value="auto">when it's dark</option><option value="on">on</option><option value="off">off</option></select></label>
      <label>Light <select id="mode"><option value="band">in bands</option><option value="soft">soft</option></select></label>
    </div>
    <p id="info"></p>
  </div>
</div>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------
// Units are centimetres. The room is seen from straight above: x right, y down, z up.
// Every object is a prism: a convex footprint at z0 and (for limbs) another at z1. Its shadow on a
// surface at height zr is the convex hull of its corners projected along the light onto that plane.
// ---------------------------------------------------------------------------------------------
const DESK_BANDS = [[0.45, 1.0], [0.16, 0.62], [0.06, 0.34], [0.03, 0.16]]; // [share of the light under the lamp, brightness]
const LAT = 59.33, LON = 18.07, TZ = "Europe/Stockholm";
const ROOM = { w: 792, h: 544, wall: 20, height: 270 };  // the floor plan (Figma, 14 Oct): a 50 cm grid
const GROUND = 4000;  // the ground runs on well past any screen's edge, so light and shadows never stop short

// --- geometry ---------------------------------------------------------------------------------
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
const circle = (cx, cy, r, n = 16) => Array.from({ length: n }, (_, i) => [cx + r * Math.cos(2 * Math.PI * i / n), cy + r * Math.sin(2 * Math.PI * i / n)]);
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);

function hull(points) { // monotone chain, counter-clockwise
  const p = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const q of p) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop(); lower.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop(); upper.push(q); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}

function area(poly) { let a = 0; for (let i = 0; i < poly.length; i++) { const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length]; a += x1 * y2 - x2 * y1; } return a / 2; }

function clip(subject, clipper) { // Sutherland–Hodgman: convex ∩ convex
  if (area(clipper) < 0) clipper = clipper.slice().reverse();
  let out = subject;
  for (let i = 0; i < clipper.length && out.length; i++) {
    const a = clipper[i], b = clipper[(i + 1) % clipper.length];
    const inside = p => (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]) >= 0;
    const meet = (p, q) => { const d1 = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]), d2 = (b[0] - a[0]) * (q[1] - a[1]) - (b[1] - a[1]) * (q[0] - a[0]); const t = d1 / (d1 - d2); return [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t]; };
    const input = out; out = [];
    for (let j = 0; j < input.length; j++) {
      const p = input[j], q = input[(j + 1) % input.length];
      if (inside(q)) { if (!inside(p)) out.push(meet(p, q)); out.push(q); } else if (inside(p)) out.push(meet(p, q));
    }
  }
  return out;
}

function bbox(poly) { let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity; for (const [x, y] of poly) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); } return [x0, y0, x1, y1]; }
const overlaps = (a, b) => a[0] <= b[2] && b[0] <= a[2] && a[1] <= b[3] && b[1] <= a[3];

// --- the sun (NOAA's low-precision formulas, good to a fraction of a degree) ----------------------
function sun(date) {
  const rad = Math.PI / 180, n = date.getTime() / 86400000 + 2440587.5 - 2451545.0;
  const L = (280.460 + 0.9856474 * n) % 360, g = ((357.528 + 0.9856003 * n) % 360) * rad;
  const lambda = (L + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * rad, eps = (23.439 - 0.0000004 * n) * rad;
  const ra = Math.atan2(Math.cos(eps) * Math.sin(lambda), Math.cos(lambda)), dec = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const gmst = (18.697374558 + 24.06570982441908 * n) % 24, H = (gmst * 15 + LON) * rad - ra, phi = LAT * rad;
  const el = Math.asin(Math.sin(phi) * Math.sin(dec) + Math.cos(phi) * Math.cos(dec) * Math.cos(H));
  const az = Math.atan2(-Math.sin(H), Math.tan(dec) * Math.cos(phi) - Math.sin(phi) * Math.cos(H));
  return { el: el / rad, az: (az / rad + 360) % 360 };
}

const LOCAL = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
function localParts(date) { return Object.fromEntries(LOCAL.formatToParts(date).map(p => [p.type, p.value])); }

function stockholm(dateStr, minutes) { // local wall time in Stockholm (minutes may have a fraction) → the instant
  const [Y, M, D] = dateStr.split("-").map(Number);
  const guess = Date.UTC(Y, M - 1, D) + minutes * 60000;
  const p = localParts(new Date(guess));
  const shown = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return new Date(guess - (shown - guess));
}

function kelvin(k) { // Tanner Helland's approximation, 0..1
  const t = k / 100;
  const r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  const g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  const b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  return [r, g, b].map(v => clamp(v, 0, 255) / 255);
}
const mix = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));
const css = (c, k = 1) => `rgb(${c.map(v => Math.round(clamp(v * k, 0, 1) * 255)).join(",")})`;

// --- the room (the floor plan, measured from the sketch) ------------------------------------------------
const C = { floor: "#f5edc6", wall: "#3b3a38", desk: "#b3aca0", chair: "#8a857d", tray: "#e9e5dd", lamp: "#77736c", shade: "#e4ded2",
  screen: "#4b4a48", keys: "#7c7973", board: "#a59a86", note: "#d9c46a", calendar: "#c9c3b8", line: "#6f6a62", cabinet: "#9c968c",
  drawer: "#aaa499", telex: "#8f8a82", paper: "#efece6", bin: "#8d8a84",
  body: "#6e6a64", head: "#56524d", limb: "#625e58", shoe: "#46433f" };

const objects = [];   // static: { id, poly, z0, z1, color, top?, face?, group, occludes, receives }
const add = (o) => { objects.push(Object.assign({ occludes: true, receives: true, group: o.id }, o)); };
// Some things show the real state (papers in a tray, notes on the board, balls in the bin) and are rebuilt
// when it changes; the lamps' light is then made again (see draw).
const piles = { dirty: true };
function replace(prefix, build) {
  for (let i = objects.length - 1; i >= 0; i--) if (objects[i].id.startsWith(prefix)) objects.splice(i, 1);
  build();
  piles.dirty = true;
}
const ellipse = (cx, cy, rx, ry, n = 16) => Array.from({ length: n }, (_, i) => [cx + rx * Math.cos(2 * Math.PI * i / n), cy + ry * Math.sin(2 * Math.PI * i / n)]);

// A tilted plate (the board, the calendar): low along one edge, high along the opposite one. As a prism from the
// low edge to the high edge its shadow is the plate's; it takes light on its whole face, at its middle height.
function tilted(x, y, w, h, high, zLow, zHigh) { // the plane of a plate rising towards its `high` edge
  const n = { n: [0, (zLow - zHigh) / h, y], s: [0, (zHigh - zLow) / h, y + h], w: [(zLow - zHigh) / w, 0, x], e: [(zHigh - zLow) / w, 0, x + w] }[high];
  const [B, C] = n, A = high === "n" ? zHigh - C * y : high === "s" ? zLow - C * y : high === "w" ? zHigh - B * x : zLow - B * x;
  return { A, B, C };
}
function plate(id, x, y, w, h, high, zLow, zHigh, color, legs = true) {
  const strip = { n: rect(x, y, w, 3), s: rect(x, y + h - 3, w, 3), w: rect(x, y, 3, h), e: rect(x + w - 3, y, 3, h) };
  const opposite = { n: "s", s: "n", w: "e", e: "w" }[high];
  const plane = tilted(x, y, w, h, high, zLow, zHigh), at = (px, py) => plane.A + plane.B * px + plane.C * py;
  if (legs) { // four legs from under the plate's corners, splaying out like an easel's so their feet show
    const cx = x + w / 2, cy = y + h / 2, out = 10;
    for (const [k, [lx, ly]] of [[x + 4, y + 4], [x + w - 4, y + 4], [x + w - 4, y + h - 4], [x + 4, y + h - 4]].entries()) {
      const d = Math.hypot(lx - cx, ly - cy), fx = lx + (lx - cx) / d * out, fy = ly + (ly - cy) / d * out;
      add({ id: `${id}-leg-${k}`, bottom: circle(fx, fy, 2.2, 8), top: circle(lx, ly, 2.2, 8), z0: 0, z1: at(lx, ly) - 0.5, color, group: id });
    }
  }
  add({ id, bottom: strip[opposite], top: strip[high], face: rect(x, y, w, h), z0: zLow, z1: zHigh, zr: (zLow + zHigh) / 2,
    plane, planeMin: zLow, color });
  // Things lying on the plate (post-its, lines) take its plane too.
  return (pid, poly, pcolor) => add({ id: pid, poly, z0: zLow, z1: zHigh + 0.1, zr: (zLow + zHigh) / 2 + 0.6,  // z1: drawn after the plate
    plane: { A: plane.A + 0.6, B: plane.B, C: plane.C }, planeMin: zLow, color: pcolor, occludes: false, group: id });
}
const rgb = (hex) => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255);
const flat = (id, poly, z, color, group) => add({ id, poly, z0: z - 0.4, z1: z, color, occludes: false, group: group || id });

// The ground the office stands on: the page's own colour, lit like everything else (the page background is
// this, in the light of the moment, so the office melts into the page).
const BG = "#f8f8f7";
add({ id: "ground", poly: rect(-GROUND, -GROUND, ROOM.w + 2 * GROUND, ROOM.h + 2 * GROUND), z0: 0, z1: 0, color: BG, occludes: false });
add({ id: "floor", poly: rect(0, 0, ROOM.w, ROOM.h), z0: 0, z1: 0, color: C.floor, occludes: false });

// The floor's grid: 50 cm squares, red-brown at low opacity, running about 60 cm past the floor's edge.
const GRID = { step: 50, over: 62, width: 3, color: "rgba(181, 115, 90, 0.30)" };
// Centred: as many lines as fit, with the same margin on both sides.
GRID.x0 = (ROOM.w - (Math.floor(ROOM.w / GRID.step) - 1) * GRID.step) / 2;
GRID.y0 = (ROOM.h - (Math.floor(ROOM.h / GRID.step) - 1) * GRID.step) / 2;
function drawGrid(g) {
  g.fillStyle = GRID.color;
  for (let x = GRID.x0; x < ROOM.w; x += GRID.step) g.fillRect(x - GRID.width / 2, -GRID.over, GRID.width, ROOM.h + 2 * GRID.over);
  for (let y = GRID.y0; y < ROOM.h; y += GRID.step) g.fillRect(-GRID.over, y - GRID.width / 2, ROOM.w + 2 * GRID.over, GRID.width);
}

// Desks: shape and colour, one per person (nothing on them yet). Rounded corners are many-sided, still convex.
function roundRect(x, y, w, h, r, seg = 4) { // r: one radius, or [top-left, top-right, bottom-right, bottom-left]
  const [tl, tr, br, bl] = Array.isArray(r) ? r : [r, r, r, r], pts = [];
  const corner = (cx, cy, rr, a0) => {
    if (!rr) { pts.push([cx, cy]); return; }
    for (let i = 0; i <= seg; i++) { const a = a0 + (Math.PI / 2) * i / seg; pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]); }
  };
  corner(x + w - tr, y + tr, tr, -Math.PI / 2); corner(x + w - br, y + h - br, br, 0); corner(x + bl, y + h - bl, bl, Math.PI / 2); corner(x + tl, y + tl, tl, Math.PI);
  return pts;
}
const DESK = {
  assistant: "#dcb98a",    // light birch, soft corners: warm and near
  director: "#6b4632",     // dark walnut, heavy, an L: the one who thinks about where you're going
  researcher: "#b5835a",   // an oak work table, long and plain: room for maps and papers
  manager: "#8fa19a",      // a sage-green steel desk, tight corners: order and timing
};
// Turn what was added since `from` a few degrees about (cx, cy): chairs, computers and small things stand a little
// askew, as in a real room. Footprints, slanted parts, faces and tilted planes all turn together.
function turn(from, cx, cy, deg) {
  const t = deg * Math.PI / 180, c = Math.cos(t), s = Math.sin(t);
  const r = (poly) => poly && poly.map(([x, y]) => [cx + (x - cx) * c - (y - cy) * s, cy + (x - cx) * s + (y - cy) * c]);
  for (const o of objects.slice(from)) {
    for (const k of ["poly", "bottom", "top", "face", "shape"]) if (o[k]) o[k] = r(o[k]);
    if (o.plane) { // z = A + Bx + Cy, seen from the turned frame
      const { A, B, C } = o.plane, B2 = B * c - C * s, C2 = B * s + C * c;
      o.plane = { A: A + B * cx + C * cy - B2 * cx - C2 * cy, B: B2, C: C2 };
    }
  }
}

// Furniture is built from its parts, like the real thing: a thin top on legs, so light passes underneath and the
// shadow is the top's shape, moved away from the sun, with thin lines from the legs. (A solid block from the
// floor up casts a heavy, wrong shadow.)
function table(id, x, y, w, h, r, seg, top, color, group = id) {
  add({ id, poly: roundRect(x, y, w, h, r, seg), z0: top - 3.5, z1: top, color, group });
  const i = 6;
  for (const [k, [lx, ly]] of [[x + i, y + i], [x + w - i, y + i], [x + w - i, y + h - i], [x + i, y + h - i]].entries()) {
    add({ id: `${id}-leg-${k}`, poly: rect(lx - 2, ly - 2, 4, 4), z0: 0, z1: top - 3.5, color, group, receives: false });
  }
}
table("manager-desk", 22, 22, 76, 190, 3, 4, 74, DESK.manager);
// Director's L: two tops that overlap where they meet, with square corners there, so it reads as one top.
table("director-desk", 560, 142, 213, 78, [4, 0, 4, 4], 4, 76, DESK.director);
table("director-desk-side", 698, 50, 75, 100, [4, 4, 0, 0], 4, 76, DESK.director, "director-desk");
table("assistant-desk", 101, 458, 153, 72, 14, 6, 74, DESK.assistant);
table("researcher-desk", 656, 284, 92, 247, 2, 4, 75, DESK.researcher);
const inboxes = {   // where papers are put: the letter trays on the desks (drawn below)
  manager: rect(44, 150, 28, 34), director: rect(606, 150, 34, 28), assistant: rect(115, 464, 28, 34), researcher: rect(668, 292, 34, 28),
};

// Chairs, one for each person, kept simple: a seat, a back that stands on the seat's edge, and what it stands
// on (a post with five legs on wheels, or four plain legs).
const WHEEL = "#4d4a46";
function chair(role, x, y, back, o) {
  const g = role + "-chair", S = o.size / 2, c = o.color;
  // The seat: round or rounded square. The back: a bar on the side away from the desk, as wide as the seat's
  // edge there (on a round seat, a chord), so it stands on the seat all along.
  const round = o.round, bw = round ? S * 1.4 : 2 * S, inset = round ? Math.sqrt(S * S - (bw / 2) ** 2) : S;
  add({ id: role + "-seat", poly: round ? circle(x, y, S, 24) : roundRect(x - S, y - S, 2 * S, 2 * S, o.corner ?? 8), z0: 43, z1: 47, color: c, group: g });
  const t = o.back ?? 5, at = { n: [x - bw / 2, y - inset - t / 2, bw, t], s: [x - bw / 2, y + inset - t / 2, bw, t], w: [x - inset - t / 2, y - bw / 2, t, bw], e: [x + inset - t / 2, y - bw / 2, t, bw] }[back];
  add({ id: role + "-back", poly: roundRect(...at, t / 2), z0: 47, z1: o.backTop, color: o.backColor || c, group: g });
  if (o.legs === 4) { // four plain legs under the corners
    for (const [k, [lx, ly]] of [[x - S + 3, y - S + 3], [x + S - 3, y - S + 3], [x + S - 3, y + S - 3], [x - S + 3, y + S - 3]].entries()) {
      add({ id: `${role}-leg-${k}`, poly: rect(lx - 1.6, ly - 1.6, 3.2, 3.2), z0: 0, z1: 43, color: c, group: g, receives: false });
    }
    return;
  }
  add({ id: role + "-post", poly: circle(x, y, 2.5, 8), z0: 7, z1: 43, color: o.frame || c, group: g, receives: false });
  for (let k = 0; k < 5; k++) { // five legs on wheels, reaching out past the seat
    const a = 2 * Math.PI * k / 5 + 0.63, u = [Math.cos(a), Math.sin(a)], v = [-u[1], u[0]], w = 1.5, L = S + 6;

// The board (saved findings, as post-its) and the calendar: tilted towards the room.
// Seen from above, anything lying on a tilted plate is foreshortened along the slope: a square post-it looks
// like a short wide strip, and a frame's top and bottom look thinner than its sides. That is what tells the eye
// it is tilted.
function rotated(poly, deg) {
  const [cx, cy] = poly.reduce((a, p) => [a[0] + p[0] / poly.length, a[1] + p[1] / poly.length], [0, 0]), t = deg * Math.PI / 180;
  return poly.map(([x, y]) => [cx + (x - cx) * Math.cos(t) - (y - cy) * Math.sin(t), cy + (x - cx) * Math.sin(t) + (y - cy) * Math.cos(t)]);
}
function border(on, id, x, y, w, h, across, along, color) { // across: frame width seen across the slope; along: on it
  on(id + "-f1", rect(x, y, w, along), color); on(id + "-f2", rect(x, y + h - along, w, along), color);
  on(id + "-f3", rect(x, y + along, across, h - 2 * along), color); on(id + "-f4", rect(x + w - across, y + along, across, h - 2 * along), color);
}
const BOARD_FORESHORTEN = 54 / Math.hypot(54, 90);   // the board rises 90 cm over 54 cm
const onBoard = plate("board", 245, 15, 151, 54, "n", 95, 185, C.board);
border(onBoard, "board-frame", 245, 15, 151, 54, 3, 3 * BOARD_FORESHORTEN, "#8f846f");
const NOTE_COLORS = ["#e8d36a", "#e8d36a", "#efb9a6", "#e8d36a", "#a9cfe0"];
function setBoard(n) { // a post-it for every saved finding, fourteen at most, in two loose rows
  replace("note-", () => {
    for (let k = 0; k < Math.min(14, n); k++) {
      const col = k % 7, row = Math.floor(k / 7), x = 252 + col * 20 + ((k * 13) % 5) - 2, y = 22 + row * 20 + ((k * 7) % 5) - 2;
      onBoard("note-" + k, rotated(rect(x, y, 13, 13 * BOARD_FORESHORTEN), ((k * 29) % 11) - 5), NOTE_COLORS[k % NOTE_COLORS.length]);   // 13 cm notes, foreshortened
    }
  });
}
// The calendar: a month planner, light paper in a thin frame. Seven days along its length, five weeks across its
// slope (foreshortened), the weekday row along the high edge, and a few days with something on them.
const CAL = { x: 22, y: 237, w: 46, h: 210, low: 95, high: 150 };
const CAL_FORESHORTEN = CAL.w / Math.hypot(CAL.w, CAL.high - CAL.low);
const onCalendar = plate("calendar", CAL.x, CAL.y, CAL.w, CAL.h, "w", CAL.low, CAL.high, "#ebe6dc");
{
  const f = CAL_FORESHORTEN, inX = CAL.x + 2.5 * f, inY = CAL.y + 2.5, inW = CAL.w - 5 * f, inH = CAL.h - 5, head = 7 * f;
  border(onCalendar, "cal-frame", CAL.x, CAL.y, CAL.w, CAL.h, 2.5 * f, 2.5, "#b5ad9f");
  onCalendar("cal-head", rect(inX, inY, head, inH), "#c9c1b2");
  const day = inH / 7, week = (inW - head) / 5;
  for (let i = 1; i < 7; i++) onCalendar("cal-day-" + i, rect(inX, inY + i * day - 0.3, inW, 0.6), "#d3ccbf");
  for (let j = 1; j < 5; j++) onCalendar("cal-week-" + j, rect(inX + head + j * week - 0.3, inY, 0.6, inH), "#d3ccbf");
  CAL.cell = (d, w, k) => rect(inX + head + w * week + 1 * f, inY + d * day + 2 + k * 4, week - 2 * f, Math.max(3, day - 4 - k * 4));
}
const CAL_COLORS = { finding: "#e8d36a", reminder: "#e3b4a2", promise: "#a9cfe0" };
function setCalendar(items) { // each planned thing on its day: seven days along, this week and the four after it across
  replace("cal-event-", () => {
    const monday = new Date(); monday.setHours(0, 0, 0, 0); monday.setDate(monday.getDate() - (monday.getDay() + 6) % 7);
    const used = {};
    for (const it of items) {
      const t = new Date(it.at), days = Math.floor((t - monday) / 86400000), w = Math.floor(days / 7), d = days % 7;
      if (w < 0 || w > 4) continue;
      const key = d + "-" + w, k = used[key] = (used[key] ?? -1) + 1;
      if (k < 3) onCalendar(`cal-event-${key}-${k}`, CAL.cell(d, w, k), CAL_COLORS[it.kind] || CAL_COLORS.finding);
    }
  });
}

canvas.addEventListener("click", () => { if (hover) openSheet(hover); });
// --- the window: what a piece of furniture holds --------------------------------------------------------
const closeSheet = () => { $("veil").classList.add("hidden"); openName = null; };
$("close").addEventListener("click", closeSheet);
$("veil").addEventListener("click", (e) => { if (e.target.id === "veil") closeSheet(); });
addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

const esc = (v) => String(v ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (iso, o) => iso ? new Date(iso).toLocaleString("en-GB", o) : "";
const clock = (iso) => fmt(iso, { hour: "2-digit", minute: "2-digit" });
const dayOf = (iso) => fmt(iso, { weekday: "long", day: "numeric", month: "long" });
const when = (iso) => fmt(iso, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function ago(iso) {
  if (!iso) return "not yet";
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return `${m} min ago`; if (m < 24 * 60) return `${Math.round(m / 60)} h ago`;
  return "last " + when(iso);
}
// The roles' notes are Markdown: bold and headings shown as such, the rest as written.
const notes = (md) => esc(md).replace(/^#+\s*(.*)$/gm, "<strong>$1</strong>").replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const diff = (patch) => patch.split("\n").map(l => l.startsWith("+") ? `<span class="add">${esc(l.slice(1))}</span>` : l.startsWith("-") ? `<span class="del">${esc(l.slice(1))}</span>` : esc(l.slice(1))).join("\n");

// Along the top: the four roles, and whether they are at work now or when they last were.
function showRoles() {
  $("roles").innerHTML = ["assistant", "director", "researcher", "manager"].map(r => {
    const w = live.working[r];
    return `<span><span class="who">${NAME[r]}</span> ` + (w ? `<span class="busy"><span class="dot"></span>${esc(w.task || TASK[w.kind] || "working")}</span>`
      : `<span class="ago">${ago(live.last?.[r])}</span>`) + "</span>";
  }).join("");
}
setInterval(showRoles, 30000);
showRoles();

// Everything a click can show is fetched ahead and kept fresh, so a window opens at once. The latest pieces of
// work on each desk are fetched ahead too (a finished piece of work doesn't change).
const OBJECTS = ["desk-assistant", "desk-director", "desk-researcher", "desk-manager", "archive", "bin", "calendar", "board"];
const ahead = {}, works = {};
let openName = null;
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
async function fetchObject(name) {
  try {
    const d = await getJSON("/api/thing/" + name);
    ahead[name] = d;
    if (openName === name && !document.querySelector("#sheet .detail:not([hidden])")) render(name, d);
    if (d.work) for (const w of d.work.slice(0, 12)) if (!works[w.id]) works[w.id] = getJSON("/api/work/" + w.id).catch(() => { delete works[w.id]; return null; });
  } catch { /* not on the Pi: nothing to show */ }
}
const fetchAll = () => OBJECTS.reduce((p, n) => p.then(() => fetchObject(n)), Promise.resolve());
let soon = null;
const fetchSoon = () => { clearTimeout(soon); soon = setTimeout(fetchAll, 2500); };   // after something happened
fetchAll();
setInterval(fetchAll, 60000);

function openSheet(name) {
  openName = name;
  $("veil").classList.remove("hidden");
  if (ahead[name]) render(name, ahead[name]);
  else $("sheet-body").innerHTML = location.protocol === "file:" || !navigator.onLine ? "<p class='muted'>This only works on the Pi.</p>" : "<p class='muted'>Loading…</p>";
  fetchObject(name);
}

// Short, readable bits of a tool's input: a web address as its site, the rest cut short.
function short(input) {
  const s = String(input ?? "");
  const url = s.match(/https?:\/\/([^/\s"]+)/);
  if (url) return url[1].replace(/^www\./, "");
  return s.replace(/[{}"]/g, "").slice(0, 90);
}
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

function render(name, d) {
  const body = $("sheet-body");
  const list = (items, f) => items && items.length ? "<ul class='plain'>" + items.map(f).join("") + "</ul>" : "<p class='muted'>Nothing here.</p>";
  let html = `<h2>${esc(d.title)}</h2><p class="muted">${esc(d.about)}</p>`;
  if (name.startsWith("desk-")) {
    html += `<p class="status">${d.working ? `<span class="dot"></span>Working now: ${esc(d.working.task)}` : `Not working right now · last active ${esc(ago(d.last))}`}</p>`;
    html += `<h3>Inbox${d.inbox.length ? " · " + d.inbox.length : ""}</h3>` + (d.inbox.length ? list(d.inbox, i =>
      `<li class="row"><span class="when">${esc(clock(i.at))}</span><span><span class="text">${esc(i.text)}</span><div class="muted">${esc(i.what)}${i.from ? " from " + esc(i.from) : ""}</div></span></li>`)
      : "<p class='muted'>Empty: nothing is waiting.</p>");
    const FORM = { step: "Step", experiment: "Experiment", question: "Question" };
    html += "<h3>On the desk: plans</h3>" + list(d.plans, i => `<li class="row"><span class="when">${i.when ? esc(fmt(i.when.replace(" ", "T"), { day: "numeric", month: "short" })) : ""}</span><span>${esc(i.title)}<div class="muted">${esc(i.ref)} · ${FORM[i.form] || i.form} · ${esc(i.status)}${i.serves ? " · for " + esc(i.serves) : ""}</div></span></li>`);
    html += "<h3>Recent work</h3>";
    // Repeated small jobs in a row (reading watched pages) become one line.
    const rows = [];
    for (const w of d.work) {
      const prev = rows[rows.length - 1];
      if (w.kind === "page_extract" && prev && prev.kind === "page_extract" && dayOf(prev.at) === dayOf(w.at)) { prev.count++; prev.first = w.at; continue; }
      rows.push({ ...w, count: 1, first: w.at });
    }
    let day = "";
    for (const w of rows) {
      const dd = dayOf(w.at);
      if (dd !== day) { html += `<div class="day">${esc(dd)}</div>`; day = dd; }
      if (w.kind === "page_extract") {
        html += `<div class="row"><span class="when">${esc(w.count > 1 ? clock(w.first) + "–" + clock(w.at) : clock(w.at))}</span><span class="muted">Read ${w.count > 1 ? plural(w.count, "watched page") : "a watched page"}</span></div>`;
        continue;
      }
      html += `<div class="work row" data-id="${w.id}"><span class="when">${esc(clock(w.at))}</span><span class="what">${esc(w.summary || w.task)}</span></div>`;
      if (w.made && w.made.length) html += `<ul class="plain made">` + w.made.map(m => `<li class="row"><span class="when">${esc(m.ref)}</span><span>${esc(m.title)}<div class="muted">${esc(m.form)}${m.kind ? " · " + esc(m.kind) : ""} · ${m.new ? "new" : "changed"} · now ${esc(m.status)}</div></span></li>`).join("") + "</ul>";
      html += `<div class="detail" id="work-${w.id}" hidden></div>`;
    }
    if (!d.work.length) html += "<p class='muted'>Nothing yet.</p>";
    html += `<h3>Its notes</h3>` + (d.memory ? `<div class="notes">${notes(d.memory)}</div>` : "<p class='muted'>Empty.</p>");
  } else if (name === "archive") {
    const KIND = { goal: "Goal", project: "Project", pursuit: "Opportunity", idea: "Idea" };
    html += "<h3>Goals, and what you go for</h3>" + list(d.records, r => `<li class="row"><span class="when">${esc(r.ref)}</span><span>${esc(r.title)}<div class="muted">${KIND[r.kind] || r.kind} · ${esc(r.status)}${r.deadline ? " · by " + esc(fmt(r.deadline, { day: "numeric", month: "short" })) : ""}</div></span></li>`);
    html += "<h3>What Audax holds about you</h3>" + list(d.beliefs, b => `<li class="row"><span class="when">${esc(b.ref)}</span><span>${esc(b.title)}<div class="muted">${b.said ? "you said it" : esc(b.by) + " thinks so"} · ${esc(b.kind)}${b.until ? " · until " + esc(fmt(b.until, { day: "numeric", month: "short" })) : ""}</div></span></li>`);
    html += "<h3>Experiments</h3>" + list(d.experiments, x => `<li class="row"><span class="when">${esc(x.ref)}</span><span>${esc(x.title)}<div class="muted">${esc(x.by)} · ${esc(x.kind)} · ${esc(x.status)}${x.judged ? " · judged " + esc(fmt(x.judged.replace(" ", "T"), { day: "numeric", month: "short" })) : ""}</div></span></li>`);
    for (const dr of d.drawers) html += `<h3>${esc(dr.name)}'s drawer</h3>` + list(dr.files, f => `<li class="row"><span class="when">${esc(ago(f.changed))}</span><span>${esc(f.path)}</span></li>`);
  } else if (name === "bin") {
    html += list(d.items, i => `<li class="row"><span class="when">${esc(clock(i.at))}</span><span>${esc(i.title)}<div class="muted">${esc(i.by)}${i.why ? ": " + esc(i.why) : ""}</div></span></li>`);
  } else if (name === "calendar") {
    const byDay = (items, at) => { let out = "", day = ""; for (const i of items) { const dd = dayOf(at(i)); if (dd !== day) { out += `<div class="day">${esc(dd)}</div>`; day = dd; } out += `<div class="row"><span class="when">${esc(clock(at(i)))}</span><span>${esc(i.title)}</span></div>`; } return out || "<p class='muted'>Nothing.</p>"; };
    html += "<h3>Planned to bring up with you</h3>" + byDay(d.planned, i => i.at);
    html += "<h3>Your sessions</h3>" + byDay(d.yours, i => i.start);
  } else if (name === "board") {
    html += list(d.items, i => `<li class="row"><span class="when">${esc(ago(i.at))}</span><span>${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.title)}</a>` : esc(i.title)}${i.url ? `<div class="muted">${esc(short(i.url))}</div>` : ""}</span></li>`);
  }
  body.innerHTML = html;
  body.querySelectorAll(".work").forEach(el => el.addEventListener("click", () => openWork(el.dataset.id)));
}

// One piece of work, opened in place: what it was about, the steps it took, its answer, what it sent and changed.
async function openWork(id) {
  const box = $("work-" + id);
  if (!box.hidden) { box.hidden = true; return; }
  box.hidden = false;
  if (!works[id]) works[id] = getJSON("/api/work/" + id).catch(() => null);
  const loading = setTimeout(() => { box.innerHTML = "<p class='muted'>Loading…</p>"; }, 150);   // only if it wasn't fetched ahead
  const w = await works[id];
  clearTimeout(loading);
  if (!w) { box.innerHTML = "<p class='muted'>Couldn't load it.</p>"; return; }
  let html = "";
  if (w.failed) html += `<p class="muted">It didn't finish: ${esc(w.error)}</p>`;
  if (w.account) html += `<h3>In its own words</h3><div class="notes">${notes(w.account)}</div>`;
  if (w.about.length) html += "<h3>What it was about</h3><ul class='plain'>" + w.about.map(a =>
    `<li><div class="muted">${esc(a.label)}</div><span class="text">${esc(a.text)}</span>${a.note ? `<div class="muted">${esc(a.note)}</div>` : ""}</li>`).join("") + "</ul>";
  if (w.answer) html += `<h3>Its answer</h3><div class="notes">${notes(w.answer)}</div>`;
  if (w.posts.length) html += "<h3>What it sent</h3><ul class='plain'>" + w.posts.map(p => `<li><div class="muted">${esc(p.kind)} to ${esc(p.to)}</div><span class="text">${esc(p.text)}</span></li>`).join("") + "</ul>";
  if (w.edits.length) html += "<h3>What it changed</h3>" + w.edits.map(e =>
    `<details><summary>${esc(e.file)} <span class="muted">+${e.added} −${e.removed} lines</span></summary><pre class="diff">${diff(e.patch)}</pre></details>`).join("");
  if (w.tools.length) html += "<h3>Steps</h3><ul class='plain'>" + w.tools.map(t => `<li>${esc(t.tool)}${short(t.input) ? ` <span class="muted">· ${esc(short(t.input))}</span>` : ""}${t.failed ? " <span class='tag'>failed</span>" : ""}</li>`).join("") + "</ul>";
  box.innerHTML = html || "<p class='muted'>Nothing more was recorded.</p>";
}

resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
